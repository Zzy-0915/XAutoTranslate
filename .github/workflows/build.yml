name: Build JailFools Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          curl -fsSL -o /tmp/iPhoneOS16.5.sdk.tar.xz https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz
          tar -xf /tmp/iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks
          rm /tmp/iPhoneOS16.5.sdk.tar.xz

      - name: Build Dylib
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

      - name: Collect Dylib
        run: |
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/XAutoTranslate.dylib \;
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
