name: Build JailFools Dylib (Dual-Engine Permanent Auto-Translate)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // ==================== 核心状态与双引擎缓存管理 ====================
          static NSMutableSet<NSString *> *gHookedKeys = nil;
          static NSMutableSet<NSString *> *gTriggeredTweetIDs = nil;
          static NSMutableSet<NSString *> *gFallbackInFlightIDs = nil;
          static NSMutableDictionary<NSString *, NSString *> *gFallbackTranslatedCache = nil;
          static NSHashTable<UIView *> *gTrackedViews = nil;
          static NSMutableArray<void(^)(void)> *gActionQueue = nil;
          static NSLock *gStateLock = nil;
          static BOOL gIsQueueRunning = NO;

          static const char *kBoundViewModelKey = "kBoundViewModelKey";
          static const char *kBoundIsCommentKey = "kBoundIsCommentKey";
          static const char *kBoundTweetIDKey = "kBoundTweetIDKey";
          static const char *kLastViewportYKey = "kLastViewportYKey";
          static const char *kLastViewportTimeKey = "kLastViewportTimeKey";
          static const char *kViewModelLockedKey = "kViewModelLockedKey";
          static const char *kViewModelQueuedKey = "kViewModelQueuedKey";

          static const NSInteger kFallbackBtnOverlayTag = 998871;
          static const NSInteger kFallbackBodyOverlayTag = 998872;

          static BOOL SafeCallBool(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return NO;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2) return NO;
              char ret = sig.methodReturnType[0];
              if (ret != 'B' && ret != 'c') return NO;
              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static id SafeCallObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2 || sig.methodReturnType[0] != '@') return nil;
              return ((id(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          // ==================== 语种与有效外文过滤（过滤中文、纯媒体与超短无意义词） ====================
          static BOOL IsValidForeignText(NSString *rawText) {
              if (!rawText || rawText.length == 0) return NO;

              NSUInteger hanziCount = 0;
              NSUInteger kanaOrHangulCount = 0;
              NSUInteger foreignLetterCount = 0;
              NSUInteger validWordCount = 0;

              NSArray<NSString *> *words = [rawText componentsSeparatedByCharactersInSet:[NSCharacterSet whitespaceAndNewlineCharacterSet]];
              NSMutableString *cleanText = [NSMutableString string];
              for (NSString *w in words) {
                  if (w.length == 0) continue;
                  if ([w hasPrefix:@"http://"] || [w hasPrefix:@"https://"] || [w hasPrefix:@"@"] || [w hasPrefix:@"#"]) {
                      continue;
                  }
                  validWordCount++;
                  [cleanText appendString:w];
              }

              NSUInteger len = cleanText.length;
              if (len == 0) return NO;

              for (NSUInteger i = 0; i < len; i++) {
                  unichar c = [cleanText characterAtIndex:i];
                  if ((c >= 0x3040 && c <= 0x30FF) || (c >= 0x31F0 && c <= 0x31FF) || (c >= 0xAC00 && c <= 0xD7AF)) {
                      kanaOrHangulCount++;
                      foreignLetterCount++;
                  } else if (c >= 0x4E00 && c <= 0x9FFF) {
                      hanziCount++;
                  } else if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z') || (c >= 0x00C0 && c <= 0x024F) || (c >= 0x0400 && c <= 0x06FF)) {
                      foreignLetterCount++;
                  }
              }

              if (kanaOrHangulCount >= 2) return YES;

              NSUInteger totalLetters = hanziCount + foreignLetterCount;
              if (totalLetters < 4 || (validWordCount < 2 && foreignLetterCount < 6)) return NO;

              if (hanziCount > 0 && ((double)hanziCount / (double)totalLetters) >= 0.20) {
                  return NO;
              }

              return foreignLetterCount >= 4;
          }

          static NSString *ExtractModelRawText(id vmOrStatus) {
              if (!vmOrStatus) return nil;

              NSArray *textSelectors = @[@"displayText", @"text", @"fullText", @"renderedText"];
              for (NSString *selName in textSelectors) {
                  id txtVal = SafeCallObject(vmOrStatus, NSSelectorFromString(selName));
                  if ([txtVal isKindOfClass:[NSString class]] && [(NSString *)txtVal length] > 0) {
                      return (NSString *)txtVal;
                  }
              }

              NSArray *subKeys = @[@"statusViewModel", @"representedStatus", @"status", @"tweet", @"conversationNode"];
              for (NSString *subKey in subKeys) {
                  id subObj = SafeCallObject(vmOrStatus, NSSelectorFromString(subKey));
                  if (subObj && subObj != vmOrStatus) {
                      NSString *subText = ExtractModelRawText(subObj);
                      if (subText.length > 0) return subText;
                  }
              }

              return nil;
          }

          static BOOL IsForeignTranslatableViewModel(id vmOrStatus) {
              if (!vmOrStatus) return NO;

              NSArray *langSelectors = @[@"originalLanguage", @"language", @"lang"];
              for (NSString *selName in langSelectors) {
                  id langVal = SafeCallObject(vmOrStatus, NSSelectorFromString(selName));
                  if ([langVal isKindOfClass:[NSString class]]) {
                      NSString *lang = [(NSString *)langVal lowercaseString];
                      if ([lang hasPrefix:@"zh"] ||
                          [lang isEqualToString:@"und"] ||
                          [lang isEqualToString:@"zxx"] ||
                          [lang isEqualToString:@"qme"] ||
                          [lang isEqualToString:@"qam"] ||
                          [lang isEqualToString:@"qht"] ||
                          [lang isEqualToString:@"qst"] ||
                          [lang isEqualToString:@"art"]) {
                          return NO;
                      }
                  }
              }

              NSString *rawText = ExtractModelRawText(vmOrStatus);
              if (rawText) {
                  return IsValidForeignText(rawText);
              }

              return YES;
          }

          // ==================== 唯一 ID 与内容哈希提取 ====================
          static NSString *ExtractRealTweetID(id vmOrStatus) {
              if (!vmOrStatus) return nil;

              NSString *rawText = ExtractModelRawText(vmOrStatus);
              if (rawText && rawText.length >= 2) {
                  return [NSString stringWithFormat:@"thash_%lu", (unsigned long)[rawText hash]];
              }

              NSArray *idSelectors = @[@"statusIDString", @"statusID", @"tweetIDString", @"tweetID", @"focalStatusID", @"entryID"];
              for (NSString *selName in idSelectors) {
                  SEL sel = NSSelectorFromString(selName);
                  if ([vmOrStatus respondsToSelector:sel]) {
                      NSMethodSignature *sig = [vmOrStatus methodSignatureForSelector:sel];
                      if (sig && sig.numberOfArguments == 2) {
                          if (sig.methodReturnType[0] == '@') {
                              id val = ((id(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if ([val isKindOfClass:[NSString class]] && [(NSString *)val length] > 0) return val;
                          } else if (sig.methodReturnType[0] == 'q' || sig.methodReturnType[0] == 'Q') {
                              long long val = ((long long(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if (val > 0) return [NSString stringWithFormat:@"%lld", val];
                          }
                      }
                  }
              }

              NSArray *subKeys = @[@"statusViewModel", @"representedStatus", @"status", @"tweet", @"conversationNode"];
              for (NSString *subKey in subKeys) {
                  id subObj = SafeCallObject(vmOrStatus, NSSelectorFromString(subKey));
                  if (subObj && subObj != vmOrStatus) {
                      NSString *subId = ExtractRealTweetID(subObj);
                      if (subId) return subId;
                  }
              }

              return [NSString stringWithFormat:@"ptr_%p", vmOrStatus];
          }

          static void CollectSubviews(UIView *view, NSMutableArray<UIView *> *outArray) {
              if (!view) return;
              for (UIView *sub in view.subviews) {
                  [outArray addObject:sub];
                  CollectSubviews(sub, outArray);
              }
          }

          // ==================== 视图层级与背景色解析 ====================
          static UIView *FindTweetContainerView(UIView *translateView) {
              UIView *cur = translateView.superview;
              UIView *best = cur;
              while (cur && ![cur isKindOfClass:[UIWindow class]]) {
                  NSString *clsName = NSStringFromClass([cur class]);
                  if ([cur isKindOfClass:[UITableViewCell class]] ||
                      [cur isKindOfClass:[UICollectionViewCell class]] ||
                      [clsName containsString:@"StatusView"] ||
                      [clsName containsString:@"Cell"]) {
                      return cur;
                  }
                  if (cur.bounds.size.width > 200.0 && cur.bounds.size.height > 45.0) {
                      best = cur;
                  }
                  cur = cur.superview;
              }
              return best;
          }

          static UIColor *ResolveBackgroundColor(UIView *view) {
              UIView *cur = view;
              while (cur && ![cur isKindOfClass:[UIWindow class]]) {
                  if (cur.backgroundColor) {
                      CGFloat alpha = 0.0;
                      if ([cur.backgroundColor getRed:NULL green:NULL blue:NULL alpha:&alpha] ||
                          [cur.backgroundColor getWhite:NULL alpha:&alpha]) {
                          if (alpha > 0.9) {
                              return cur.backgroundColor;
                          }
                      }
                  }
                  cur = cur.superview;
              }
              return [UIColor systemBackgroundColor];
          }

          static NSString *ExtractTextFromView(UIView *v) {
              if (!v) return nil;
              if ([v isKindOfClass:[UILabel class]] && [(UILabel *)v text].length > 0) {
                  return [(UILabel *)v text];
              }
              id textModel = SafeCallObject(v, NSSelectorFromString(@"attributedTextModel")) ?:
                             SafeCallObject(v, NSSelectorFromString(@"textModel"));
              if (textModel) {
                  id attrStr = SafeCallObject(textModel, NSSelectorFromString(@"attributedString"));
                  if ([attrStr isKindOfClass:[NSAttributedString class]] && [(NSAttributedString *)attrStr length] > 0) {
                      return [(NSAttributedString *)attrStr string];
                  }
              }
              id attrText = SafeCallObject(v, NSSelectorFromString(@"attributedText")) ?:
                            SafeCallObject(v, NSSelectorFromString(@"attributedString"));
              if ([attrText isKindOfClass:[NSAttributedString class]] && [(NSAttributedString *)attrText length] > 0) {
                  return [(NSAttributedString *)attrText string];
              }
              id rawText = SafeCallObject(v, NSSelectorFromString(@"text")) ?:
                           SafeCallObject(v, NSSelectorFromString(@"titleText"));
              if ([rawText isKindOfClass:[NSString class]] && [(NSString *)rawText length] > 0) {
                  return (NSString *)rawText;
              }
              if (v.accessibilityLabel && v.accessibilityLabel.length > 0) {
                  return v.accessibilityLabel;
              }
              return nil;
          }

          static UIView *FindBodyTextViewInContainer(UIView *container, UIView *translateView, NSString **outBodyText) {
              if (!container || !translateView) return nil;

              CGRect transRect = [translateView convertRect:translateView.bounds toView:container];
              NSMutableArray<UIView *> *allSubs = [NSMutableArray array];
              CollectSubviews(container, allSubs);

              UIView *bestView = nil;
              NSString *bestText = nil;
              CGFloat minDistance = 9999.0;

              for (UIView *sub in allSubs) {
                  if (sub == translateView || [sub isDescendantOfView:translateView]) continue;
                  if (sub.tag == kFallbackBtnOverlayTag || sub.tag == kFallbackBodyOverlayTag) continue;
                  if (sub.hidden || sub.alpha < 0.01) continue;

                  CGRect r = [sub convertRect:sub.bounds toView:container];
                  if (r.size.width < 100.0 || r.size.height < 14.0) continue;

                  CGFloat dy = r.origin.y - transRect.origin.y;
                  if (dy < -8.0 || dy > 70.0) continue;

                  NSString *clsName = NSStringFromClass([sub class]);
                  BOOL isTextClass = ([clsName containsString:@"AttributedTextView"] ||
                                      [clsName containsString:@"BodyView"] ||
                                      [clsName containsString:@"TextView"] ||
                                      [sub isKindOfClass:[UILabel class]]);
                  if (!isTextClass) continue;

                  NSString *txt = ExtractTextFromView(sub);
                  if (txt && IsValidForeignText(txt)) {
                      if (dy >= 0 && dy < minDistance) {
                          minDistance = dy;
                          bestView = sub;
                          bestText = txt;
                      }
                  } else if (!bestView && dy >= 0 && dy < minDistance) {
                      minDistance = dy;
                      bestView = sub;
                  }
              }

              if (outBodyText && bestText) {
                  *outBodyText = bestText;
              }
              return bestView;
          }

          static void ClearFallbackOverlays(UIView *translateView) {
              if (!translateView) return;
              [[translateView viewWithTag:kFallbackBtnOverlayTag] removeFromSuperview];
              UIView *container = FindTweetContainerView(translateView);
              if (container) {
                  NSMutableArray<UIView *> *allSubs = [NSMutableArray array];
                  CollectSubviews(container, allSubs);
                  for (UIView *sub in allSubs) {
                      if (sub.tag == kFallbackBodyOverlayTag || sub.tag == kFallbackBtnOverlayTag) {
                          [sub removeFromSuperview];
                      }
                  }
              }
          }

          static void ApplyFallbackOverlay(UIView *translateView, NSString *translatedText) {
              if (!translateView || translatedText.length == 0) return;

              UIView *container = FindTweetContainerView(translateView);
              if (!container) return;

              NSString *dummy = nil;
              UIView *bodyView = FindBodyTextViewInContainer(container, translateView, &dummy);
              if (!bodyView) return;

              UIColor *bgColor = ResolveBackgroundColor(container);

              UILabel *btnOverlay = (UILabel *)[translateView viewWithTag:kFallbackBtnOverlayTag];
              if (!btnOverlay) {
                  btnOverlay = [[UILabel alloc] initWithFrame:translateView.bounds];
                  btnOverlay.tag = kFallbackBtnOverlayTag;
                  btnOverlay.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                  btnOverlay.font = [UIFont systemFontOfSize:12.0 weight:UIFontWeightRegular];
                  btnOverlay.textColor = [UIColor secondaryLabelColor];
                  btnOverlay.userInteractionEnabled = NO;
                  [translateView addSubview:btnOverlay];
              }
              btnOverlay.frame = translateView.bounds;
              btnOverlay.backgroundColor = bgColor;
              btnOverlay.text = @"🌐 已自动翻译";

              UILabel *bodyOverlay = (UILabel *)[bodyView viewWithTag:kFallbackBodyOverlayTag];
              if (!bodyOverlay) {
                  bodyOverlay = [[UILabel alloc] initWithFrame:bodyView.bounds];
                  bodyOverlay.tag = kFallbackBodyOverlayTag;
                  bodyOverlay.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
                  bodyOverlay.font = [UIFont systemFontOfSize:15.0 weight:UIFontWeightRegular];
                  bodyOverlay.textColor = [UIColor labelColor];
                  bodyOverlay.numberOfLines = 0;
                  bodyOverlay.lineBreakMode = NSLineBreakByWordWrapping;
                  bodyOverlay.adjustsFontSizeToFitWidth = YES;
                  bodyOverlay.minimumScaleFactor = 0.72;
                  bodyOverlay.userInteractionEnabled = NO;
                  [bodyView addSubview:bodyOverlay];
              }
              bodyOverlay.frame = bodyView.bounds;
              bodyOverlay.backgroundColor = bgColor;
              bodyOverlay.text = translatedText;
          }

          // ==================== 第二引擎：内置 Google GTX 免限流直连翻译 ====================
          static void TriggerDirectFallbackTranslation(UIView *translateView, id viewModel, NSString *tid) {
              if (!translateView || !viewModel || !tid) return;

              [gStateLock lock];
              NSString *cached = gFallbackTranslatedCache[tid];
              BOOL inFlight = [gFallbackInFlightIDs containsObject:tid];
              [gStateLock unlock];

              if (cached.length > 0) {
                  ApplyFallbackOverlay(translateView, cached);
                  return;
              }
              if (inFlight) return;

              UIView *container = FindTweetContainerView(translateView);
              NSString *bodyText = ExtractModelRawText(viewModel);
              NSString *viewText = nil;
              FindBodyTextViewInContainer(container, translateView, &viewText);
              if (viewText.length > bodyText.length) {
                  bodyText = viewText;
              }

              if (!bodyText || !IsValidForeignText(bodyText)) return;

              [gStateLock lock];
              [gFallbackInFlightIDs addObject:tid];
              [gStateLock unlock];

              NSString *encoded = [bodyText stringByAddingPercentEncodingWithAllowedCharacters:[NSCharacterSet URLQueryAllowedCharacterSet]];
              if (!encoded) return;

              NSString *urlStr = [NSString stringWithFormat:@"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=%@", encoded];
              NSURL *url = [NSURL URLWithString:urlStr];
              if (!url) return;

              __weak UIView *weakView = translateView;
              __weak id weakVM = viewModel;

              NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithURL:url completionHandler:^(NSData * _Nullable data, NSURLResponse * _Nullable response, NSError * _Nullable error) {
                  NSMutableString *resultText = [NSMutableString string];
                  if (data && !error) {
                      id json = [NSJSONSerialization JSONObjectWithData:data options:0 error:nil];
                      if ([json isKindOfClass:[NSArray class]] && [(NSArray *)json count] > 0) {
                          id sentences = json[0];
                          if ([sentences isKindOfClass:[NSArray class]]) {
                              for (id seg in (NSArray *)sentences) {
                                  if ([seg isKindOfClass:[NSArray class]] && [(NSArray *)seg count] > 0) {
                                      id part = seg[0];
                                      if ([part isKindOfClass:[NSString class]]) {
                                          [resultText appendString:(NSString *)part];
                                      }
                                  }
                              }
                          }
                      }
                  }

                  [gStateLock lock];
                  [gFallbackInFlightIDs removeObject:tid];
                  if (resultText.length > 0) {
                      if (gFallbackTranslatedCache.count > 2000) [gFallbackTranslatedCache removeAllObjects];
                      gFallbackTranslatedCache[tid] = [resultText copy];
                  }
                  [gStateLock unlock];

                  if (resultText.length > 0) {
                      dispatch_async(dispatch_get_main_queue(), ^{
                          UIView *strongView = weakView;
                          id strongVM = weakVM;
                          if (!strongView || !strongVM) return;
                          if (objc_getAssociatedObject(strongView, kBoundViewModelKey) == strongVM) {
                              ApplyFallbackOverlay(strongView, resultText);
                          }
                      });
                  }
              }];
              [task resume];
          }

          // ==================== 状态检查与滚动驻留检测 ====================
          static BOOL IsScrollViewRapidlyMoving(UIView *view) {
              UIView *cur = view.superview;
              while (cur && ![cur isKindOfClass:[UIWindow class]]) {
                  if ([cur isKindOfClass:[UIScrollView class]]) {
                      UIScrollView *sv = (UIScrollView *)cur;
                      if (sv.isDragging || sv.isTracking) return YES;
                      break;
                  }
                  cur = cur.superview;
              }
              return NO;
          }

          static BOOL IsViewReadyAndStationaryInViewport(UIView *view) {
              if (!view || !view.window || view.hidden || view.alpha < 0.01) return NO;
              if (view.bounds.size.width < 10.0 || view.bounds.size.height < 5.0) return NO;
              if (IsScrollViewRapidlyMoving(view)) return NO;

              UIWindow *win = view.window;
              CGRect rect = [view convertRect:view.bounds toView:win];
              if (rect.size.width <= 0 || rect.size.height <= 0) return NO;
              CGFloat screenH = win.bounds.size.height;
              if (rect.origin.y + rect.size.height < 35.0 || rect.origin.y > screenH - 35.0) return NO;

              double now = CACurrentMediaTime();
              NSNumber *lastYNum = objc_getAssociatedObject(view, kLastViewportYKey);
              NSNumber *lastTimeNum = objc_getAssociatedObject(view, kLastViewportTimeKey);

              objc_setAssociatedObject(view, kLastViewportYKey, @(rect.origin.y), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              objc_setAssociatedObject(view, kLastViewportTimeKey, @(now), OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              if (!lastYNum || !lastTimeNum) return NO;

              double dt = now - [lastTimeNum doubleValue];
              CGFloat dy = fabs(rect.origin.y - [lastYNum doubleValue]);

              return (dt >= 0.15 && dy < 60.0);
          }

          static NSInteger CheckTranslationStatus(UIView *container, id viewModel) {
              if ([container viewWithTag:kFallbackBtnOverlayTag]) return 1;

              NSMutableArray<UIView *> *allViews = [NSMutableArray arrayWithObject:container];
              CollectSubviews(container, allViews);

              for (UIView *v in allViews) {
                  if (v.tag == kFallbackBtnOverlayTag || v.tag == kFallbackBodyOverlayTag) return 1;
                  if (SafeCallBool(v, NSSelectorFromString(@"showingTranslation"))) return 1;

                  NSString *text = ExtractTextFromView(v);
                  if (text && text.length > 0) {
                      if ([text containsString:@"失败"] ||
                          [text containsString:@"重试"] ||
                          [text containsString:@"Retry"] ||
                          [text containsString:@"Failed"]) {
                          return 2;
                      }
                      if ([text containsString:@"原文"] ||
                          [text containsString:@"Original"] ||
                          [text containsString:@"翻译自"] ||
                          [text containsString:@"Translated from"] ||
                          [text containsString:@"已翻译"] ||
                          [text containsString:@"正在"] ||
                          [text containsString:@"Translating"]) {
                          return 1;
                      }
                  }
              }

              if (viewModel) {
                  if (SafeCallBool(viewModel, NSSelectorFromString(@"isShowingTranslation"))) return 1;
                  if (SafeCallBool(viewModel, NSSelectorFromString(@"showingTranslation"))) return 1;
              }

              return 0;
          }

          // ==================== 队列调度引擎 ====================
          static void ProcessNextQueueAction(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  void (^nextAction)(void) = nil;
                  [gStateLock lock];
                  if (gActionQueue.count > 0) {
                      nextAction = gActionQueue.firstObject;
                      [gActionQueue removeObjectAtIndex:0];
                  } else {
                      gIsQueueRunning = NO;
                  }
                  [gStateLock unlock];

                  if (nextAction) {
                      nextAction();
                  }
              });
          }

          static void InspectAndScheduleView(UIView *view) {
              if (!view || !view.window || view.hidden) return;

              id viewModel = objc_getAssociatedObject(view, kBoundViewModelKey);
              if (!viewModel) return;

              NSString *tid = objc_getAssociatedObject(view, kBoundTweetIDKey) ?: ExtractRealTweetID(viewModel);

              if (tid) {
                  [gStateLock lock];
                  NSString *cachedFallback = gFallbackTranslatedCache[tid];
                  [gStateLock unlock];
                  if (cachedFallback.length > 0) {
                      ApplyFallbackOverlay(view, cachedFallback);
                      return;
                  }
              }

              NSInteger status = CheckTranslationStatus(view, viewModel);
              if (status == 2) {
                  TriggerDirectFallbackTranslation(view, viewModel, tid ?: @"fallback");
                  return;
              }
              if (status == 1) {
                  objc_setAssociatedObject(viewModel, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  return;
              }

              if (!IsViewReadyAndStationaryInViewport(view)) return;

              if (objc_getAssociatedObject(viewModel, kViewModelLockedKey)) return;
              if (objc_getAssociatedObject(viewModel, kViewModelQueuedKey)) return;

              if (tid) {
                  [gStateLock lock];
                  BOOL alreadyTriggered = [gTriggeredTweetIDs containsObject:tid];
                  [gStateLock unlock];
                  if (alreadyTriggered) {
                      objc_setAssociatedObject(viewModel, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      return;
                  }
              }

              objc_setAssociatedObject(viewModel, kViewModelQueuedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              BOOL isComment = [objc_getAssociatedObject(view, kBoundIsCommentKey) boolValue];

              __weak UIView *weakView = view;
              __weak id weakVM = viewModel;

              void (^actionBlock)(void) = ^{
                  UIView *strongView = weakView;
                  id strongVM = weakVM;

                  if (strongVM) {
                      objc_setAssociatedObject(strongVM, kViewModelQueuedKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }

                  if (!strongView || !strongVM || !strongView.window || IsScrollViewRapidlyMoving(strongView)) {
                      ProcessNextQueueAction();
                      return;
                  }

                  NSInteger curStatus = CheckTranslationStatus(strongView, strongVM);
                  if (curStatus == 2) {
                      TriggerDirectFallbackTranslation(strongView, strongVM, tid ?: @"fallback");
                      ProcessNextQueueAction();
                      return;
                  }
                  if (curStatus == 1 || objc_getAssociatedObject(strongVM, kViewModelLockedKey)) {
                      objc_setAssociatedObject(strongVM, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      ProcessNextQueueAction();
                      return;
                  }

                  NSMutableArray<UIView *> *candidates = [NSMutableArray arrayWithObject:strongView];
                  CollectSubviews(strongView, candidates);

                  BOOL triggered = NO;

                  for (UIView *v in candidates) {
                      if ([v respondsToSelector:NSSelectorFromString(@"tapActionBlock")]) {
                          @try {
                              id blockObj = ((id(*)(id, SEL))objc_msgSend)(v, NSSelectorFromString(@"tapActionBlock"));
                              if (blockObj && [blockObj isKindOfClass:NSClassFromString(@"NSBlock")]) {
                                  void (^block)(void) = (void(^)(void))blockObj;
                                  block();
                                  triggered = YES;
                                  break;
                              }
                          } @catch (NSException *e) {}
                      }
                  }

                  if (!triggered) {
                      for (UIView *v in candidates) {
                          @try {
                              id helper = nil;
                              Ivar ivar = class_getInstanceVariable([v class], "_tappableViewHelper");
                              if (ivar) helper = object_getIvar(v, ivar);
                              if (!helper && [v respondsToSelector:NSSelectorFromString(@"tappableViewHelper")]) {
                                  helper = SafeCallObject(v, NSSelectorFromString(@"tappableViewHelper"));
                              }
                              if (helper) {
                                  SEL tapSel = NSSelectorFromString(@"_tapAction");
                                  if ([helper respondsToSelector:tapSel]) {
                                      ((void(*)(id, SEL))objc_msgSend)(helper, tapSel);
                                      triggered = YES;
                                      break;
                                  }
                                  SEL tapArgSel = NSSelectorFromString(@"_tapAction:");
                                  if ([helper respondsToSelector:tapArgSel]) {
                                      ((void(*)(id, SEL, id))objc_msgSend)(helper, tapArgSel, v.gestureRecognizers.firstObject);
                                      triggered = YES;
                                      break;
                                  }
                              }
                          } @catch (NSException *e) {}
                      }
                  }

                  if (triggered) {
                      objc_setAssociatedObject(strongVM, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      if (tid) {
                          [gStateLock lock];
                          if (gTriggeredTweetIDs.count > 4000) [gTriggeredTweetIDs removeAllObjects];
                          [gTriggeredTweetIDs addObject:tid];
                          [gStateLock unlock];
                      }

                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          if (strongView && objc_getAssociatedObject(strongView, kBoundViewModelKey) == strongVM) {
                              if (CheckTranslationStatus(strongView, strongVM) == 2) {
                                  TriggerDirectFallbackTranslation(strongView, strongVM, tid ?: @"fallback");
                              }
                          }
                      });

                      NSTimeInterval delay = isComment ? 0.32 : 0.45;
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(delay * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          ProcessNextQueueAction();
                      });
                  } else {
                      ProcessNextQueueAction();
                  }
              };

              [gStateLock lock];
              if (!gActionQueue) gActionQueue = [NSMutableArray array];
              if (isComment) {
                  [gActionQueue insertObject:[actionBlock copy] atIndex:0];
              } else {
                  [gActionQueue addObject:[actionBlock copy]];
              }
              if (gActionQueue.count > 15) {
                  [gActionQueue removeObjectsInRange:NSMakeRange(15, gActionQueue.count - 15)];
              }
              if (!gIsQueueRunning) {
                  gIsQueueRunning = YES;
                  dispatch_async(dispatch_get_main_queue(), ^{
                      ProcessNextQueueAction();
                  });
              }
              [gStateLock unlock];
          }

          static void TrackTranslateView(UIView *view, id viewModel, BOOL isComment) {
              if (!view || !viewModel) return;

              id oldVM = objc_getAssociatedObject(view, kBoundViewModelKey);
              if (oldVM != viewModel) {
                  ClearFallbackOverlays(view);
                  objc_setAssociatedObject(view, kLastViewportYKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  objc_setAssociatedObject(view, kLastViewportTimeKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              }

              if (!IsForeignTranslatableViewModel(viewModel)) {
                  objc_setAssociatedObject(view, kBoundViewModelKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  return;
              }

              NSString *tid = ExtractRealTweetID(viewModel);
              objc_setAssociatedObject(view, kBoundViewModelKey, viewModel, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              objc_setAssociatedObject(view, kBoundIsCommentKey, @(isComment), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
              objc_setAssociatedObject(view, kBoundTweetIDKey, tid, OBJC_ASSOCIATION_COPY_NONATOMIC);

              [gStateLock lock];
              [gTrackedViews addObject:view];
              NSString *cachedFallback = tid ? gFallbackTranslatedCache[tid] : nil;
              [gStateLock unlock];

              if (cachedFallback.length > 0) {
                  dispatch_async(dispatch_get_main_queue(), ^{
                      ApplyFallbackOverlay(view, cachedFallback);
                  });
                  return;
              }
          }

          static void ScanTrackedViewsInViewport(void) {
              [gStateLock lock];
              NSArray<UIView *> *allTracked = [gTrackedViews allObjects];
              [gStateLock unlock];

              for (UIView *view in allTracked) {
                  InspectAndScheduleView(view);
              }
          }

          // ==================== Hook 节点 ====================
          static BOOL CanHook(Class cls, SEL sel) {
              if (!cls || !sel) return NO;
              NSString *key = [NSString stringWithFormat:@"%@::%@", NSStringFromClass(cls), NSStringFromSelector(sel)];
              @synchronized (gHookedKeys) {
                  if ([gHookedKeys containsObject:key]) return NO;
                  [gHookedKeys addObject:key];
                  return YES;
              }
          }

          static void InstallHooks(void) {
              Class grokBtnAdapterCls = objc_getClass("T1StandardStatusGrokTranslateButtonViewAdapter");
              if (grokBtnAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(grokBtnAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, visSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              return IsForeignTranslatableViewModel(vm);
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(grokBtnAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, vm, view);
                              TrackTranslateView(view, vm, NO);
                          }));
                      }
                  }
              }

              Class translateAdapterCls = objc_getClass("T1StandardStatusTranslateAdapter");
              if (translateAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(translateAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, visSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              return IsForeignTranslatableViewModel(vm);
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(translateAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, vm, view);
                              TrackTranslateView(view, vm, YES);
                          }));
                      }
                  }
              }

              Class bodyAdapterCls = objc_getClass("T1ConversationTranslatedBodyAdapter");
              if (bodyAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  SEL transVMSel = NSSelectorFromString(@"translatedViewModelForViewModel:");
                  if (CanHook(bodyAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(bodyAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              BOOL origVal = ((BOOL(*)(id, SEL, id))orig)(self, visSel, vm);
                              if (origVal) return YES;
                              if ([self respondsToSelector:transVMSel]) {
                                  id transVM = ((id(*)(id, SEL, id))objc_msgSend)(self, transVMSel, vm);
                                  if (transVM != nil) return YES;
                              }
                              return NO;
                          }));
                      }
                  }
              }

              Class grokHelperCls = objc_getClass("T1GrokPostTranslationDisplayHelper");
              if (grokHelperCls) {
                  SEL init1 = NSSelectorFromString(@"initWithStatusViewModel:account:forFocalView:");
                  if (CanHook(grokHelperCls, init1)) {
                      Method m = class_getInstanceMethod(grokHelperCls, init1);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^id(id self, id vm, id acc, BOOL focal) {
                              return ((id(*)(id, SEL, id, id, BOOL))orig)(self, init1, vm, acc, YES);
                          }));
                      }
                  }
              }
          }

          // ==================== 构造入口 ====================
          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gHookedKeys = [[NSMutableSet alloc] init];
                  gTriggeredTweetIDs = [[NSMutableSet alloc] init];
                  gFallbackInFlightIDs = [[NSMutableSet alloc] init];
                  gFallbackTranslatedCache = [[NSMutableDictionary alloc] init];
                  gTrackedViews = [NSHashTable weakObjectsHashTable];
                  gActionQueue = [[NSMutableArray alloc] init];
                  gStateLock = [[NSLock alloc] init];

                  dispatch_async(dispatch_get_main_queue(), ^{
                      InstallHooks();
                      [NSTimer scheduledTimerWithTimeInterval:0.25 repeats:YES block:^(NSTimer * _Nonnull timer) {
                          ScanTrackedViewsInViewport();
                      }];
                  });

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      InstallHooks();
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fobjc-exceptions \
            -framework Foundation -framework UIKit -framework QuartzCore -framework CoreGraphics \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
