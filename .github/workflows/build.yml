name: Build XAutoTranslate with Apple SDK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test GTX cache, scheduling and native text factory
        run: |
          mkdir -p build
          xcrun --sdk macosx clang -fobjc-arc -fobjc-exceptions -fblocks -Wall -Wextra -Werror -ISources tests/EngineTests.m Sources/XGTXEngine.m Sources/XGTXNativeDisplay.m -framework Foundation -o build/engine-tests
          build/engine-tests
      - name: Compile and sign with iPhoneOS SDK
        run: bash scripts/build-ios.sh
      - name: Check build without temporary diagnostics
        env:
          XAD_DIAGNOSTICS: '0'
          XAD_OUTPUT_DIR: build/no-diagnostics
        run: bash scripts/build-ios.sh
      - name: Upload verified dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-v5-X12.33-${{ github.run_number }}
          path: |
            output/XAutoTranslate-v5.dylib
            output/build-info.txt
            output/README.md
          if-no-files-found: error
          retention-days: 30
