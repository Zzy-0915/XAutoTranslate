name: Build XAutoTranslate with Apple SDK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify extracted vendor payload
        run: python3 scripts/vendor-payload.py --verify-only
      - name: Test GTX cache, scheduling and native text factory
        run: |
          mkdir -p build
          xcrun --sdk macosx clang -fobjc-arc -fobjc-exceptions -fblocks -Wall -Wextra -Werror -DXAT_TESTING=1 -ISources tests/EngineTests.m Sources/XGTXEngine.m Sources/XNativeTranslation.m Sources/XTranslationRouter.m -framework Foundation -o build/engine-tests
          build/engine-tests
      - name: Compile and sign with iPhoneOS SDK
        run: bash scripts/build-ios.sh
      - name: Upload verified dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-v12-X12.33-${{ github.run_number }}
          path: |
            output/XAutoTranslate-v12.dylib
            output/XAutoTranslate-v12-Inject.zip
            output/XAutoTranslate-v12-Inject.deb
            output/build-info.txt
            output/README.md
          if-no-files-found: error
          retention-days: 30
