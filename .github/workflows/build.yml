name: Build JailFools Dylib (Pure Fast Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // ==================== 核心状态管理 ====================
          static NSMutableSet<NSString *> *gHookedKeys = nil;
          static NSMutableSet<NSString *> *gTriggeredTweetIDs = nil;
          static NSMutableArray<void(^)(void)> *gActionQueue = nil;
          static NSLock *gQueueLock = nil;
          static BOOL gIsQueueRunning = NO;

          static const char *kViewModelLockedKey = "kViewModelLockedKey";
          static const char *kViewModelQueuedKey = "kViewModelQueuedKey";

          static BOOL SafeCallBool(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return NO;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2) return NO;
              char ret = sig.methodReturnType[0];
              if (ret != 'B' && ret != 'c') return NO;
              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static id SafeCallObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2 || sig.methodReturnType[0] != '@') return nil;
              return ((id(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          // ==================== 推文与评论唯一 ID 提取 ====================
          static NSString *ExtractRealTweetID(id vmOrStatus) {
              if (!vmOrStatus) return nil;

              NSArray *idSelectors = @[@"statusIDString", @"statusID", @"tweetIDString", @"tweetID", @"focalStatusID", @"entryID"];
              for (NSString *selName in idSelectors) {
                  SEL sel = NSSelectorFromString(selName);
                  if ([vmOrStatus respondsToSelector:sel]) {
                      NSMethodSignature *sig = [vmOrStatus methodSignatureForSelector:sel];
                      if (sig && sig.numberOfArguments == 2) {
                          if (sig.methodReturnType[0] == '@') {
                              id val = ((id(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if ([val isKindOfClass:[NSString class]] && [(NSString *)val length] > 0) return val;
                          } else if (sig.methodReturnType[0] == 'q' || sig.methodReturnType[0] == 'Q') {
                              long long val = ((long long(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if (val > 0) return [NSString stringWithFormat:@"%lld", val];
                          }
                      }
                  }
              }

              NSArray *subKeys = @[@"statusViewModel", @"representedStatus", @"status", @"tweet", @"conversationNode"];
              for (NSString *subKey in subKeys) {
                  id subObj = SafeCallObject(vmOrStatus, NSSelectorFromString(subKey));
                  if (subObj && subObj != vmOrStatus) {
                      NSString *subId = ExtractRealTweetID(subObj);
                      if (subId) return subId;
                  }
              }

              NSString *text = SafeCallObject(vmOrStatus, NSSelectorFromString(@"displayText")) ?:
                               SafeCallObject(vmOrStatus, NSSelectorFromString(@"text"));
              if (text && text.length >= 2) {
                  return [NSString stringWithFormat:@"hash_%lu", (unsigned long)[text hash]];
              }

              return [NSString stringWithFormat:@"ptr_%p", vmOrStatus];
          }

          static void CollectSubviews(UIView *view, NSMutableArray<UIView *> *outArray) {
              if (!view) return;
              for (UIView *sub in view.subviews) {
                  [outArray addObject:sub];
                  CollectSubviews(sub, outArray);
              }
          }

          // ==================== 状态检查：防止反弹与死循环 ====================
          static BOOL ShouldSkipTranslation(UIView *container, id viewModel) {
              if (viewModel) {
                  if (SafeCallBool(viewModel, NSSelectorFromString(@"isShowingTranslation"))) return YES;
                  if (SafeCallBool(viewModel, NSSelectorFromString(@"showingTranslation"))) return YES;
                  SEL stateSel = NSSelectorFromString(@"translationState");
                  if ([viewModel respondsToSelector:stateSel]) {
                      long long state = ((long long(*)(id, SEL))objc_msgSend)(viewModel, stateSel);
                      if (state == 1 || state == 2) return YES;
                  }
              }

              NSMutableArray<UIView *> *allViews = [NSMutableArray arrayWithObject:container];
              CollectSubviews(container, allViews);

              for (UIView *v in allViews) {
                  if (SafeCallBool(v, NSSelectorFromString(@"showingTranslation"))) return YES;

                  NSString *text = nil;
                  if ([v isKindOfClass:[UILabel class]]) {
                      text = [(UILabel *)v text];
                  } else if ([v respondsToSelector:NSSelectorFromString(@"titleText")]) {
                      text = SafeCallObject(v, NSSelectorFromString(@"titleText"));
                  } else if ([v respondsToSelector:NSSelectorFromString(@"text")]) {
                      text = SafeCallObject(v, NSSelectorFromString(@"text"));
                  }

                  if (text && text.length > 0) {
                      if ([text containsString:@"原文"] ||
                          [text containsString:@"Original"] ||
                          [text containsString:@"翻译自"] ||
                          [text containsString:@"Translated from"] ||
                          [text containsString:@"已翻译"] ||
                          [text containsString:@"重试"] ||
                          [text containsString:@"Retry"] ||
                          [text containsString:@"失败"] ||
                          [text containsString:@"正在"] ||
                          [text containsString:@"Translating"]) {
                          return YES;
                      }
                  }
              }

              return NO;
          }

          // ==================== 极速平滑队列调度 ====================
          static void ProcessNextQueueAction(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  void (^nextAction)(void) = nil;
                  [gQueueLock lock];
                  if (gActionQueue.count > 0) {
                      nextAction = gActionQueue.firstObject;
                      [gActionQueue removeObjectAtIndex:0];
                  } else {
                      gIsQueueRunning = NO;
                  }
                  [gQueueLock unlock];

                  if (nextAction) {
                      nextAction();
                  }
              });
          }

          static void ScheduleLockedAutoClick(UIView *view, id viewModel, BOOL isComment) {
              if (!view || !viewModel) return;

              // 物理级锁：已成功触发过的推文，永久跳过
              if (objc_getAssociatedObject(viewModel, kViewModelLockedKey)) {
                  return;
              }

              // 防重复排队锁：同一推文在队列等待中时不重复加入
              if (objc_getAssociatedObject(viewModel, kViewModelQueuedKey)) {
                  return;
              }

              NSString *tid = ExtractRealTweetID(viewModel);
              if (tid) {
                  @synchronized (gTriggeredTweetIDs) {
                      if ([gTriggeredTweetIDs containsObject:tid]) {
                          objc_setAssociatedObject(viewModel, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                          return;
                      }
                  }
              }

              // 仅标记排队中，不提前锁死
              objc_setAssociatedObject(viewModel, kViewModelQueuedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              __weak UIView *weakView = view;
              __weak id weakVM = viewModel;

              void (^actionBlock)(void) = ^{
                  UIView *strongView = weakView;
                  id strongVM = weakVM;

                  if (strongVM) {
                      objc_setAssociatedObject(strongVM, kViewModelQueuedKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  }

                  if (!strongView || !strongVM) {
                      ProcessNextQueueAction();
                      return;
                  }

                  // 状态熔断：若已在展示译文或处于翻译中，跳过并标记完成
                  if (ShouldSkipTranslation(strongView, strongVM)) {
                      objc_setAssociatedObject(strongVM, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      ProcessNextQueueAction();
                      return;
                  }

                  NSMutableArray<UIView *> *candidates = [NSMutableArray arrayWithObject:strongView];
                  CollectSubviews(strongView, candidates);

                  BOOL triggered = NO;

                  // 通道 1：调用合法 tapActionBlock
                  for (UIView *v in candidates) {
                      if ([v respondsToSelector:NSSelectorFromString(@"tapActionBlock")]) {
                          @try {
                              id blockObj = ((id(*)(id, SEL))objc_msgSend)(v, NSSelectorFromString(@"tapActionBlock"));
                              if (blockObj && [blockObj isKindOfClass:NSClassFromString(@"NSBlock")]) {
                                  void (^block)(void) = (void(^)(void))blockObj;
                                  block();
                                  triggered = YES;
                                  break;
                              }
                          } @catch (NSException *e) {}
                      }
                  }

                  // 通道 2：直调 TFNTappableViewHelper _tapAction / _tapAction:
                  if (!triggered) {
                      for (UIView *v in candidates) {
                          @try {
                              id helper = nil;
                              Ivar ivar = class_getInstanceVariable([v class], "_tappableViewHelper");
                              if (ivar) helper = object_getIvar(v, ivar);
                              if (!helper && [v respondsToSelector:NSSelectorFromString(@"tappableViewHelper")]) {
                                  helper = SafeCallObject(v, NSSelectorFromString(@"tappableViewHelper"));
                              }
                              if (helper) {
                                  SEL tapSel = NSSelectorFromString(@"_tapAction");
                                  if ([helper respondsToSelector:tapSel]) {
                                      ((void(*)(id, SEL))objc_msgSend)(helper, tapSel);
                                      triggered = YES;
                                      break;
                                  }
                                  SEL tapArgSel = NSSelectorFromString(@"_tapAction:");
                                  if ([helper respondsToSelector:tapArgSel]) {
                                      ((void(*)(id, SEL, id))objc_msgSend)(helper, tapArgSel, v.gestureRecognizers.firstObject);
                                      triggered = YES;
                                      break;
                                  }
                              }
                          } @catch (NSException *e) {}
                      }
                  }

                  // 通道 3：UIControl 原生事件
                  if (!triggered) {
                      for (UIView *v in candidates) {
                          if ([v isKindOfClass:[UIControl class]]) {
                              @try {
                                  [(UIControl *)v sendActionsForControlEvents:UIControlEventTouchUpInside];
                                  triggered = YES;
                                  break;
                              } @catch (NSException *e) {}
                          }
                      }
                  }

                  // 通道 4：无障碍兜底激活
                  if (!triggered) {
                      for (UIView *v in candidates) {
                          if ([v respondsToSelector:@selector(accessibilityActivate)]) {
                              @try {
                                  if ([v accessibilityActivate]) {
                                      triggered = YES;
                                      break;
                                  }
                              } @catch (NSException *e) {}
                          }
                      }
                  }

                  // 成功触发后才真正锁定
                  if (triggered) {
                      objc_setAssociatedObject(strongVM, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      if (tid) {
                          @synchronized (gTriggeredTweetIDs) {
                              [gTriggeredTweetIDs addObject:tid];
                              if (gTriggeredTweetIDs.count > 4000) [gTriggeredTweetIDs removeAllObjects];
                          }
                      }
                      // 70ms 黄金间隔：整屏 10 条评论仅需约 0.7 秒派发完毕，1~2 秒全部展开，杜绝 429 报错
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.07 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          ProcessNextQueueAction();
                      });
                  } else {
                      ProcessNextQueueAction();
                  }
              };

              [gQueueLock lock];
              if (!gActionQueue) gActionQueue = [NSMutableArray array];

              // 评论插队优先响应
              if (isComment) {
                  [gActionQueue insertObject:[actionBlock copy] atIndex:0];
              } else {
                  [gActionQueue addObject:[actionBlock copy]];
              }

              if (!gIsQueueRunning) {
                  gIsQueueRunning = YES;
                  dispatch_async(dispatch_get_main_queue(), ^{
                      ProcessNextQueueAction();
                  });
              }
              [gQueueLock unlock];
          }

          // ==================== Hook 节点 ====================
          static BOOL CanHook(Class cls, SEL sel) {
              if (!cls || !sel) return NO;
              NSString *key = [NSString stringWithFormat:@"%@::%@", NSStringFromClass(cls), NSStringFromSelector(sel)];
              @synchronized (gHookedKeys) {
                  if ([gHookedKeys containsObject:key]) return NO;
                  [gHookedKeys addObject:key];
                  return YES;
              }
          }

          static void InstallHooks(void) {
              // 1. 时间线 Grok 翻译适配器 (主页时间线)
              Class grokBtnAdapterCls = objc_getClass("T1StandardStatusGrokTranslateButtonViewAdapter");
              if (grokBtnAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(grokBtnAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, visSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              return YES;
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(grokBtnAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, vm, view);
                              ScheduleLockedAutoClick(view, vm, NO);
                          }));
                      }
                  }
              }

              // 2. 标准翻译适配器 (正文及评论区)
              Class translateAdapterCls = objc_getClass("T1StandardStatusTranslateAdapter");
              if (translateAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(translateAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, visSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              return YES;
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(translateAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, vm, view);
                              ScheduleLockedAutoClick(view, vm, YES);
                          }));
                      }
                  }

                  SEL updateBtnSel = NSSelectorFromString(@"_t1_updateManualTranslateButtonForViewModel:forView:");
                  if (CanHook(translateAdapterCls, updateBtnSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, updateBtnSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, updateBtnSel, vm, view);
                              ScheduleLockedAutoClick(view, vm, YES);
                          }));
                      }
                  }
              }

              // 3. 译文展开适配器
              Class bodyAdapterCls = objc_getClass("T1ConversationTranslatedBodyAdapter");
              if (bodyAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  SEL transVMSel = NSSelectorFromString(@"translatedViewModelForViewModel:");
                  if (CanHook(bodyAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(bodyAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              BOOL origVal = ((BOOL(*)(id, SEL, id))orig)(self, visSel, vm);
                              if (origVal) return YES;
                              if ([self respondsToSelector:transVMSel]) {
                                  id transVM = ((id(*)(id, SEL, id))objc_msgSend)(self, transVMSel, vm);
                                  if (transVM != nil) return YES;
                              }
                              return NO;
                          }));
                      }
                  }
              }

              // 4. 解锁 Grok 自动翻译展示开关与权限
              Class grokHelperCls = objc_getClass("T1GrokPostTranslationDisplayHelper");
              if (grokHelperCls) {
                  SEL aTextSel = NSSelectorFromString(@"shouldDisplayAutoTranslateText");
                  if (CanHook(grokHelperCls, aTextSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, aTextSel);
                      if (m) method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) { return YES; }));
                  }
                  SEL mTextSel = NSSelectorFromString(@"shouldDisplayManualTranslateText");
                  if (CanHook(grokHelperCls, mTextSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, mTextSel);
                      if (m) method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) { return YES; }));
                  }
                  SEL aBtnSel = NSSelectorFromString(@"shouldDisplayAutoTranslateButton");
                  if (CanHook(grokHelperCls, aBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, aBtnSel);
                      if (m) method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) { return YES; }));
                  }
                  SEL mBtnSel = NSSelectorFromString(@"shouldDisplayManualTranslateButton");
                  if (CanHook(grokHelperCls, mBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, mBtnSel);
                      if (m) method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) { return YES; }));
                  }
                  SEL init1 = NSSelectorFromString(@"initWithStatusViewModel:account:forFocalView:");
                  if (CanHook(grokHelperCls, init1)) {
                      Method m = class_getInstanceMethod(grokHelperCls, init1);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^id(id self, id vm, id acc, BOOL focal) {
                              return ((id(*)(id, SEL, id, id, BOOL))orig)(self, init1, vm, acc, YES);
                          }));
                      }
                  }
              }
          }

          // ==================== 构造入口 ====================
          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gHookedKeys = [[NSMutableSet alloc] init];
                  gTriggeredTweetIDs = [[NSMutableSet alloc] init];
                  gActionQueue = [[NSMutableArray alloc] init];
                  gQueueLock = [[NSLock alloc] init];

                  dispatch_async(dispatch_get_main_queue(), ^{
                      InstallHooks();
                  });

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      InstallHooks();
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fobjc-exceptions \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
