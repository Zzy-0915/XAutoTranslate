name: Build JailFools Dylib (Settings Embedded & Fast Comments)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // ==================== 全局状态与日志管理器 ====================
          static NSMutableArray<NSString *> *gLogList = nil;
          static NSLock *gLogLock = nil;
          static NSMutableSet<NSString *> *gHookedKeys = nil;
          static NSMutableSet<NSString *> *gTriggeredTweetIDs = nil;
          static NSMutableArray<void(^)(void)> *gActionQueue = nil;
          static NSLock *gQueueLock = nil;
          static BOOL gIsQueueRunning = NO;

          static const char *kViewModelLockedKey = "kViewModelLockedKey";
          static NSString *const kPrefAutoTranslateEnabled = @"XAutoTranslate_Enabled";

          static void XLog(NSString *format, ...) {
              va_list args;
              va_start(args, format);
              NSString *msg = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);

              NSDateFormatter *df = [[NSDateFormatter alloc] init];
              [df setDateFormat:@"HH:mm:ss.SSS"];
              NSString *timestamp = [df stringFromDate:[NSDate date]];
              NSString *logEntry = [NSString stringWithFormat:@"[%@] %@", timestamp, msg];

              NSLog(@"[XAutoTranslate] %@", logEntry);

              [gLogLock lock];
              if (!gLogList) gLogList = [NSMutableArray array];
              [gLogList addObject:logEntry];
              if (gLogList.count > 1000) [gLogList removeObjectAtIndex:0];
              [gLogLock unlock];
          }

          static BOOL IsAutoTranslateEnabled(void) {
              id val = [[NSUserDefaults standardUserDefaults] objectForKey:kPrefAutoTranslateEnabled];
              return val ? [val boolValue] : YES;
          }

          static void SetAutoTranslateEnabled(BOOL enabled) {
              [[NSUserDefaults standardUserDefaults] setBool:enabled forKey:kPrefAutoTranslateEnabled];
              [[NSUserDefaults standardUserDefaults] synchronize];
          }

          static BOOL SafeCallBool(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return NO;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2) return NO;
              char ret = sig.methodReturnType[0];
              if (ret != 'B' && ret != 'c') return NO;
              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static id SafeCallObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2 || sig.methodReturnType[0] != '@') return nil;
              return ((id(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          // ==================== 全面解析推文与评论唯一 ID ====================
          static NSString *ExtractRealTweetID(id vmOrStatus) {
              if (!vmOrStatus) return nil;

              NSArray *idSelectors = @[@"statusIDString", @"statusID", @"tweetIDString", @"tweetID", @"focalStatusID", @"entryID"];
              for (NSString *selName in idSelectors) {
                  SEL sel = NSSelectorFromString(selName);
                  if ([vmOrStatus respondsToSelector:sel]) {
                      NSMethodSignature *sig = [vmOrStatus methodSignatureForSelector:sel];
                      if (sig && sig.numberOfArguments == 2) {
                          if (sig.methodReturnType[0] == '@') {
                              id val = ((id(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if ([val isKindOfClass:[NSString class]] && [(NSString *)val length] > 0) return val;
                          } else if (sig.methodReturnType[0] == 'q' || sig.methodReturnType[0] == 'Q') {
                              long long val = ((long long(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if (val > 0) return [NSString stringWithFormat:@"%lld", val];
                          }
                      }
                  }
              }

              NSArray *subKeys = @[@"statusViewModel", @"representedStatus", @"status", @"tweet", @"conversationNode"];
              for (NSString *subKey in subKeys) {
                  id subObj = SafeCallObject(vmOrStatus, NSSelectorFromString(subKey));
                  if (subObj && subObj != vmOrStatus) {
                      NSString *subId = ExtractRealTweetID(subObj);
                      if (subId) return subId;
                  }
              }

              NSString *text = SafeCallObject(vmOrStatus, NSSelectorFromString(@"displayText")) ?:
                               SafeCallObject(vmOrStatus, NSSelectorFromString(@"text"));
              if (text && text.length >= 2) {
                  return [NSString stringWithFormat:@"hash_%lu", (unsigned long)[text hash]];
              }

              return [NSString stringWithFormat:@"ptr_%p", vmOrStatus];
          }

          // ==================== 状态检查：防反弹熔断 ====================
          static BOOL HasAlreadyTranslated(UIView *container, id viewModel) {
              if (viewModel) {
                  if (SafeCallBool(viewModel, NSSelectorFromString(@"isShowingTranslation"))) return YES;
                  if (SafeCallBool(viewModel, NSSelectorFromString(@"showingTranslation"))) return YES;
                  SEL stateSel = NSSelectorFromString(@"translationState");
                  if ([viewModel respondsToSelector:stateSel]) {
                      long long state = ((long long(*)(id, SEL))objc_msgSend)(viewModel, stateSel);
                      if (state == 2 || state == 3) return YES;
                  }
              }

              NSMutableArray<UIView *> *allViews = [NSMutableArray arrayWithObject:container];
              void (^__block collectSubviews)(UIView *) = ^(UIView *v) {
                  for (UIView *sub in v.subviews) {
                      [allViews addObject:sub];
                      collectSubviews(sub);
                  }
              };
              collectSubviews(container);

              for (UIView *v in allViews) {
                  if (SafeCallBool(v, NSSelectorFromString(@"showingTranslation"))) return YES;

                  NSString *text = nil;
                  if ([v isKindOfClass:[UILabel class]]) {
                      text = [(UILabel *)v text];
                  } else if ([v respondsToSelector:NSSelectorFromString(@"titleText")]) {
                      text = SafeCallObject(v, NSSelectorFromString(@"titleText"));
                  } else if ([v respondsToSelector:NSSelectorFromString(@"text")]) {
                      text = SafeCallObject(v, NSSelectorFromString(@"text"));
                  }

                  if (text && text.length > 0) {
                      if ([text containsString:@"重试"] || [text containsString:@"Retry"]) {
                          return NO;
                      }
                      if ([text containsString:@"原文"] ||
                          [text containsString:@"Original"] ||
                          [text containsString:@"翻译自"] ||
                          [text containsString:@"Translated from"] ||
                          [text containsString:@"已翻译"]) {
                          return YES;
                      }
                  }
              }

              return NO;
          }

          // ==================== 极速平滑任务队列（动态节流） ====================
          static void ProcessNextQueueAction(NSTimeInterval nextInterval) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  void (^nextAction)(void) = nil;
                  [gQueueLock lock];
                  if (gActionQueue.count > 0) {
                      nextAction = gActionQueue.firstObject;
                      [gActionQueue removeObjectAtIndex:0];
                  } else {
                      gIsQueueRunning = NO;
                  }
                  [gQueueLock unlock];

                  if (nextAction) {
                      nextAction();
                      dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(nextInterval * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                          ProcessNextQueueAction(nextInterval);
                      });
                  }
              });
          }

          static void EnqueueTranslateAction(BOOL isDetailOrComment, void(^action)(void)) {
              if (!action) return;
              [gQueueLock lock];
              if (!gActionQueue) gActionQueue = [NSMutableArray array];

              // 关键加速点：若当前进入帖子评论区，立即清理旧的时间线背景队列，让评论秒级排队
              if (isDetailOrComment && gActionQueue.count > 5) {
                  [gActionQueue removeAllObjects];
              }

              [gActionQueue addObject:[action copy]];

              // 评论区加速至 80ms 极速派发，时间线保持 160ms 平滑
              NSTimeInterval interval = isDetailOrComment ? 0.08 : 0.16;

              if (!gIsQueueRunning) {
                  gIsQueueRunning = YES;
                  dispatch_async(dispatch_get_main_queue(), ^{
                      ProcessNextQueueAction(interval);
                  });
              }
              [gQueueLock unlock];
          }

          static void ScheduleLockedAutoClick(UIView *view, id viewModel, BOOL isDetailOrComment) {
              if (!IsAutoTranslateEnabled() || !view || !viewModel) return;

              NSString *tid = ExtractRealTweetID(viewModel);

              // 检查锁定标记
              if (objc_getAssociatedObject(viewModel, kViewModelLockedKey)) {
                  if (!HasAlreadyTranslated(view, viewModel)) {
                      NSString *text = SafeCallObject(view, NSSelectorFromString(@"text"));
                      if (text && ([text containsString:@"重试"] || [text containsString:@"Retry"])) {
                          objc_setAssociatedObject(viewModel, kViewModelLockedKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                          @synchronized (gTriggeredTweetIDs) {
                              if (tid) [gTriggeredTweetIDs removeObject:tid];
                          }
                      } else {
                          return;
                      }
                  } else {
                      return;
                  }
              }

              __weak UIView *weakView = view;
              __weak id weakVM = viewModel;

              EnqueueTranslateAction(isDetailOrComment, ^{
                  UIView *strongView = weakView;
                  id strongVM = weakVM;
                  if (!strongView || !strongVM) return;

                  if (!strongView.window || strongView.hidden || strongView.alpha < 0.01) {
                      return;
                  }

                  if (HasAlreadyTranslated(strongView, strongVM)) {
                      objc_setAssociatedObject(strongVM, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                      return;
                  }

                  objc_setAssociatedObject(strongVM, kViewModelLockedKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                  if (tid) {
                      @synchronized (gTriggeredTweetIDs) {
                          [gTriggeredTweetIDs addObject:tid];
                          if (gTriggeredTweetIDs.count > 2500) [gTriggeredTweetIDs removeAllObjects];
                      }
                  }

                  NSMutableArray<UIView *> *candidates = [NSMutableArray arrayWithObject:strongView];
                  void (^__block collectSubviews)(UIView *) = ^(UIView *v) {
                      for (UIView *sub in v.subviews) {
                          [candidates addObject:sub];
                          collectSubviews(sub);
                      }
                  };
                  collectSubviews(strongView);

                  BOOL triggered = NO;

                  // 通道 A：执行合法 tapActionBlock
                  for (UIView *v in candidates) {
                      if ([v respondsToSelector:NSSelectorFromString(@"tapActionBlock")]) {
                          @try {
                              id blockObj = ((id(*)(id, SEL))objc_msgSend)(v, NSSelectorFromString(@"tapActionBlock"));
                              if (blockObj && [blockObj isKindOfClass:NSClassFromString(@"NSBlock")]) {
                                  void (^block)(void) = (void(^)(void))blockObj;
                                  XLog(@"[极速触发-Block] tapActionBlock (%@) (ID: %@)", isDetailOrComment ? @"评论" : @"时间线", tid ?: @"-");
                                  block();
                                  triggered = YES;
                                  break;
                              }
                          } @catch (NSException *e) {}
                      }
                  }

                  // 通道 B：TFNTappableViewHelper _tapAction
                  if (!triggered) {
                      for (UIView *v in candidates) {
                          @try {
                              id helper = nil;
                              Ivar ivar = class_getInstanceVariable([v class], "_tappableViewHelper");
                              if (ivar) helper = object_getIvar(v, ivar);
                              if (!helper && [v respondsToSelector:NSSelectorFromString(@"tappableViewHelper")]) {
                                  helper = SafeCallObject(v, NSSelectorFromString(@"tappableViewHelper"));
                              }
                              if (helper) {
                                  SEL tapSel = NSSelectorFromString(@"_tapAction");
                                  if ([helper respondsToSelector:tapSel]) {
                                      XLog(@"[极速触发-Helper] TFNTappableViewHelper _tapAction (%@) (ID: %@)", isDetailOrComment ? @"评论" : @"时间线", tid ?: @"-");
                                      ((void(*)(id, SEL))objc_msgSend)(helper, tapSel);
                                      triggered = YES;
                                      break;
                                  }
                              }
                          } @catch (NSException *e) {}
                      }
                  }
              });
          }

          // ==================== 独立日志查看器 (二级页面) ====================
          @interface XAutoTranslateLogViewerVC : UIViewController
          @property (nonatomic, strong) UITextView *textView;
          @property (nonatomic, strong) NSTimer *refreshTimer;
          @end

          @implementation XAutoTranslateLogViewerVC
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"实时运行日志";
              self.view.backgroundColor = [UIColor systemBackgroundColor];

              self.textView = [[UITextView alloc] initWithFrame:self.view.bounds];
              self.textView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.textView.editable = NO;
              self.textView.font = [UIFont monospacedSystemFontOfSize:11.5 weight:UIFontWeightRegular];
              self.textView.alwaysBounceVertical = YES;
              [self.view addSubview:self.textView];

              UIBarButtonItem *shareItem = [[UIBarButtonItem alloc] initWithTitle:@"导出" style:UIBarButtonItemStylePlain target:self action:@selector(onExportLog)];
              UIBarButtonItem *copyItem = [[UIBarButtonItem alloc] initWithTitle:@"复制" style:UIBarButtonItemStylePlain target:self action:@selector(onCopyLog)];
              self.navigationItem.rightBarButtonItems = @[shareItem, copyItem];

              [self refreshLogContent];
          }

          - (void)viewWillAppear:(BOOL)animated {
              [super viewWillAppear:animated];
              __weak typeof(self) weakSelf = self;
              self.refreshTimer = [NSTimer scheduledTimerWithTimeInterval:1.0 repeats:YES block:^(NSTimer * _Nonnull timer) {
                  [weakSelf refreshLogContent];
              }];
          }

          - (void)viewWillDisappear:(BOOL)animated {
              [super viewWillDisappear:animated];
              [self.refreshTimer invalidate];
              self.refreshTimer = nil;
          }

          - (void)refreshLogContent {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];
              if (![self.textView.text isEqualToString:fullLog]) {
                  self.textView.text = fullLog.length > 0 ? fullLog : @"(暂无日志记录)";
              }
          }

          - (void)onCopyLog {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];
              [UIPasteboard generalPasteboard].string = fullLog ?: @"";

              UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"提示" message:@"日志已成功复制到剪贴板" preferredStyle:UIAlertControllerStyleAlert];
              [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleCancel handler:nil]];
              [self presentViewController:alert animated:YES completion:nil];
          }

          - (void)onExportLog {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];

              NSString *tmpPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"XAutoTranslate.log"];
              [fullLog writeToFile:tmpPath atomically:YES encoding:NSUTF8StringEncoding error:nil];
              NSURL *fileURL = [NSURL fileURLWithPath:tmpPath];
              UIActivityViewController *actVC = [[UIActivityViewController alloc] initWithActivityItems:@[fileURL] applicationActivities:nil];
              [self presentViewController:actVC animated:YES completion:nil];
          }
          @end

          // ==================== 嵌入 X 设置界面的原生「自动翻译」模块 ====================
          @interface XAutoTranslateSettingsVC : UIViewController <UITableViewDelegate, UITableViewDataSource>
          @property (nonatomic, strong) UITableView *tableView;
          @end

          @implementation XAutoTranslateSettingsVC
          - (void)viewDidLoad {
              [super viewDidLoad];
              self.title = @"自动翻译";
              self.view.backgroundColor = [UIColor systemGroupedBackgroundColor];

              self.tableView = [[UITableView alloc] initWithFrame:self.view.bounds style:UITableViewStyleInsetGrouped];
              self.tableView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              self.tableView.delegate = self;
              self.tableView.dataSource = self;
              [self.view addSubview:self.tableView];
          }

          - (void)onSwitchChanged:(UISwitch *)sender {
              SetAutoTranslateEnabled(sender.isOn);
              XLog(@"[设置变更] 全自动翻译开关: %@", sender.isOn ? @"开启" : @"关闭");
          }

          - (NSInteger)numberOfSectionsInTableView:(UITableView *)tableView {
              return 3;
          }

          - (NSInteger)tableView:(UITableView *)tableView numberOfRowsInSection:(NSInteger)section {
              if (section == 0) return 1;
              if (section == 1) return 2;
              return 2;
          }

          - (NSString *)tableView:(UITableView *)tableView titleForHeaderInSection:(NSInteger)section {
              if (section == 0) return @"核心功能";
              if (section == 1) return @"系统诊断与日志";
              return @"关于插件";
          }

          - (NSString *)tableView:(UITableView *)tableView titleForFooterInSection:(NSInteger)section {
              if (section == 0) return @"开启后，在主页时间线浏览推文以及点进帖子查看评论时，外语内容将以 2-3 秒极速自动翻译呈现为中文。";
              if (section == 1) return @"实时日志可监控插件运行细节，如遇异常可一键导出日志文件分享。";
              return @"已彻底移除桌面悬浮球，原生集成于 X 设置中心。";
          }

          - (UITableViewCell *)tableView:(UITableView *)tableView cellForRowAtIndexPath:(NSIndexPath *)indexPath {
              if (indexPath.section == 0) {
                  UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleDefault reuseIdentifier:nil];
                  cell.textLabel.text = @"开启自动翻译";
                  cell.textLabel.font = [UIFont systemFontOfSize:16 weight:UIFontWeightRegular];
                  cell.selectionStyle = UITableViewCellSelectionStyleNone;
                  UISwitch *sw = [[UISwitch alloc] init];
                  sw.on = IsAutoTranslateEnabled();
                  [sw addTarget:self action:@selector(onSwitchChanged:) forControlEvents:UIControlEventValueChanged];
                  cell.accessoryView = sw;
                  return cell;
              } else if (indexPath.section == 1) {
                  UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleValue1 reuseIdentifier:nil];
                  if (indexPath.row == 0) {
                      cell.textLabel.text = @"实时运行日志";
                      cell.detailTextLabel.text = @"查看与导出";
                      cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
                  } else {
                      cell.textLabel.text = @"清空触发记录缓存";
                      cell.detailTextLabel.text = [NSString stringWithFormat:@"%lu 条", (unsigned long)gTriggeredTweetIDs.count];
                      cell.accessoryType = UITableViewCellAccessoryDisclosureIndicator;
                  }
                  return cell;
              } else {
                  UITableViewCell *cell = [[UITableViewCell alloc] initWithStyle:UITableViewCellStyleValue1 reuseIdentifier:nil];
                  cell.selectionStyle = UITableViewCellSelectionStyleNone;
                  if (indexPath.row == 0) {
                      cell.textLabel.text = @"模块版本";
                      cell.detailTextLabel.text = @"v3.6 (极速设置嵌入版)";
                  } else {
                      cell.textLabel.text = @"交互模式";
                      cell.detailTextLabel.text = @"纯原生手势 (无悬浮球)";
                  }
                  return cell;
              }
          }

          - (void)tableView:(UITableView *)tableView didSelectRowAtIndexPath:(NSIndexPath *)indexPath {
              [tableView deselectRowAtIndexPath:indexPath animated:YES];
              if (indexPath.section == 1) {
                  if (indexPath.row == 0) {
                      XAutoTranslateLogViewerVC *logVC = [[XAutoTranslateLogViewerVC alloc] init];
                      [self.navigationController pushViewController:logVC animated:YES];
                  } else {
                      @synchronized (gTriggeredTweetIDs) {
                          [gTriggeredTweetIDs removeAllObjects];
                      }
                      [self.tableView reloadData];
                      UIAlertController *alert = [UIAlertController alertControllerWithTitle:@"重置完成" message:@"已清空所有推文和评论的翻译锁定缓存" preferredStyle:UIAlertControllerStyleAlert];
                      [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleCancel handler:nil]];
                      [self presentViewController:alert animated:YES completion:nil];
                  }
              }
          }
          @end

          // ==================== Hook 拦截点 ====================
          static BOOL CanHook(Class cls, SEL sel) {
              if (!cls || !sel) return NO;
              NSString *key = [NSString stringWithFormat:@"%@::%@", NSStringFromClass(cls), NSStringFromSelector(sel)];
              @synchronized (gHookedKeys) {
                  if ([gHookedKeys containsObject:key]) return NO;
                  [gHookedKeys addObject:key];
                  return YES;
              }
          }

          static void InstallHooks(void) {
              // 1. 挂钩时间线 Grok 翻译适配器 (外面时间线)
              Class grokBtnAdapterCls = objc_getClass("T1StandardStatusGrokTranslateButtonViewAdapter");
              if (grokBtnAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(grokBtnAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              if (IsAutoTranslateEnabled()) return YES;
                              return ((BOOL(*)(id, SEL, id))orig)(self, visSel, vm);
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(grokBtnAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, vm, view);
                              ScheduleLockedAutoClick(view, vm, NO);
                          }));
                      }
                  }
              }

              // 2. 挂钩标准翻译适配器 (正文详情及评论区)
              Class translateAdapterCls = objc_getClass("T1StandardStatusTranslateAdapter");
              if (translateAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(translateAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              if (IsAutoTranslateEnabled()) return YES;
                              return ((BOOL(*)(id, SEL, id))orig)(self, visSel, vm);
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(translateAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id vm, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, vm, view);
                              ScheduleLockedAutoClick(view, vm, YES);
                          }));
                      }
                  }
              }

              // 3. 译文展开适配器
              Class bodyAdapterCls = objc_getClass("T1ConversationTranslatedBodyAdapter");
              if (bodyAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  SEL transVMSel = NSSelectorFromString(@"translatedViewModelForViewModel:");
                  if (CanHook(bodyAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(bodyAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id vm) {
                              BOOL origVal = ((BOOL(*)(id, SEL, id))orig)(self, visSel, vm);
                              if (origVal) return YES;
                              if (IsAutoTranslateEnabled() && [self respondsToSelector:transVMSel]) {
                                  id transVM = ((id(*)(id, SEL, id))objc_msgSend)(self, transVMSel, vm);
                                  if (transVM != nil) return YES;
                              }
                              return NO;
                          }));
                      }
                  }
              }

              // 4. 解锁 Grok 自动翻译展示
              Class grokHelperCls = objc_getClass("T1GrokPostTranslationDisplayHelper");
              if (grokHelperCls) {
                  SEL aTextSel = NSSelectorFromString(@"shouldDisplayAutoTranslateText");
                  if (CanHook(grokHelperCls, aTextSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, aTextSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
                  SEL mTextSel = NSSelectorFromString(@"shouldDisplayManualTranslateText");
                  if (CanHook(grokHelperCls, mTextSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, mTextSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
                  SEL aBtnSel = NSSelectorFromString(@"shouldDisplayAutoTranslateButton");
                  if (CanHook(grokHelperCls, aBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, aBtnSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
                  SEL mBtnSel = NSSelectorFromString(@"shouldDisplayManualTranslateButton");
                  if (CanHook(grokHelperCls, mBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, mBtnSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
              }
          }

          // ==================== 注入 X 设置中心 (Settings Hook) ====================
          static void OpenAutoTranslateSettingsFrom(UIViewController *fromVC) {
              XAutoTranslateSettingsVC *setVC = [[XAutoTranslateSettingsVC alloc] init];
              [fromVC.navigationController pushViewController:setVC animated:YES];
          }

          static void InstallSettingsHooks(void) {
              Class settingsVCCls = objc_getClass("T1SettingsViewController");
              if (settingsVCCls) {
                  SEL viewWillAppearSel = @selector(viewWillAppear:);
                  if (CanHook(settingsVCCls, viewWillAppearSel)) {
                      Method m = class_getInstanceMethod(settingsVCCls, viewWillAppearSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(UIViewController *self, BOOL animated) {
                              ((void(*)(id, SEL, BOOL))orig)(self, viewWillAppearSel, animated);

                              // 在设置界面右上角嵌入「自动翻译」快捷入口
                              UIBarButtonItem *item = [[UIBarButtonItem alloc] initWithTitle:@"自动翻译"
                                                                                       style:UIBarButtonItemStylePlain
                                                                                      target:self
                                                                                      action:NSSelectorFromString(@"onOpenAutoTranslateSettingsTapped")];
                              self.navigationItem.rightBarButtonItem = item;
                          }));
                      }
                  }

                  // 动态添加按钮点击响应方法
                  SEL tapSel = NSSelectorFromString(@"onOpenAutoTranslateSettingsTapped");
                  class_addMethod(settingsVCCls, tapSel, imp_implementationWithBlock(^void(UIViewController *self) {
                      OpenAutoTranslateSettingsFrom(self);
                  }), "v@:");

                  XLog(@"[Hook成功] T1SettingsViewController (设置中心已嵌入「自动翻译」)");
              }
          }

          // ==================== 构造入口 ====================
          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gLogList = [[NSMutableArray alloc] init];
                  gLogLock = [[NSLock alloc] init];
                  gHookedKeys = [[NSMutableSet alloc] init];
                  gTriggeredTweetIDs = [[NSMutableSet alloc] init];
                  gActionQueue = [[NSMutableArray alloc] init];
                  gQueueLock = [[NSLock alloc] init];

                  XLog(@"=== XAutoTranslate (设置中心嵌入极速版) 启动 ===");

                  dispatch_async(dispatch_get_main_queue(), ^{
                      InstallHooks();
                      InstallSettingsHooks();
                  });

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      InstallHooks();
                      InstallSettingsHooks();
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -fobjc-exceptions \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
