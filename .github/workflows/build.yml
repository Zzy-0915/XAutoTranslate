name: Build JailFools Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git /tmp/theos-sdks
          cp -r /tmp/theos-sdks/*.sdk ~/theos/sdks/
          rm -rf /tmp/theos-sdks

      - name: Prepare Source Files
        run: |
          # 自动统一为原生 Objective-C 格式
          if [ -f Tweak.x ] && [ ! -f Tweak.m ]; then
            mv Tweak.x Tweak.m
          fi
          ls -la

      - name: Build Dylib
        run: |
          export THEOS=$HOME/theos
          make clean
          make FINALPACKAGE=1

      - name: Collect Dylib
        run: |
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/XAutoTranslate.dylib \;
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
