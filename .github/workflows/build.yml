name: Build JailFools Dylib (Auto Click Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // ==================== 全局状态与日志管理器 ====================
          static NSMutableArray<NSString *> *gLogList = nil;
          static NSLock *gLogLock = nil;
          static NSMutableSet<NSString *> *gHookedKeys = nil;
          static const char *kAutoClickedFlagKey = "kAutoClickedFlagKey";

          static NSString *const kPrefAutoTranslateEnabled = @"XAutoTranslate_Enabled";

          static void XLog(NSString *format, ...) {
              va_list args;
              va_start(args, format);
              NSString *msg = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);

              NSDateFormatter *df = [[NSDateFormatter alloc] init];
              [df setDateFormat:@"HH:mm:ss.SSS"];
              NSString *timestamp = [df stringFromDate:[NSDate date]];
              NSString *logEntry = [NSString stringWithFormat:@"[%@] %@", timestamp, msg];

              NSLog(@"[XAutoTranslate] %@", logEntry);

              [gLogLock lock];
              if (!gLogList) gLogList = [NSMutableArray array];
              [gLogList addObject:logEntry];
              if (gLogList.count > 800) [gLogList removeObjectAtIndex:0];
              [gLogLock unlock];
          }

          static BOOL IsAutoTranslateEnabled(void) {
              id val = [[NSUserDefaults standardUserDefaults] objectForKey:kPrefAutoTranslateEnabled];
              return val ? [val boolValue] : YES;
          }

          static BOOL SafeCallBool(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return NO;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2) return NO;
              char ret = sig.methodReturnType[0];
              if (ret != 'B' && ret != 'c') return NO;
              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static id SafeCallObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2 || sig.methodReturnType[0] != '@') return nil;
              return ((id(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          // ==================== 核心：一键触发 T1TranslateButton 原生点击 ====================
          static void TriggerNativeClickOnButton(UIView *btn) {
              if (!IsAutoTranslateEnabled() || !btn || !btn.window) return;

              // 如果当前按钮已经在显示译文状态（或显示原文按钮），绝对不能点击，防止点回原文
              BOOL isShowing = SafeCallBool(btn, NSSelectorFromString(@"showingTranslation"));
              if (isShowing) return;

              NSString *title = SafeCallObject(btn, NSSelectorFromString(@"titleText")) ?:
                                SafeCallObject(btn, NSSelectorFromString(@"_t1_buttonTitle"));
              if (title && ([title containsString:@"原文"] || [title containsString:@"Original"])) {
                  return;
              }

              // 防重检查（防止同一次展示死循环触发）
              if (objc_getAssociatedObject(btn, kAutoClickedFlagKey)) return;
              objc_setAssociatedObject(btn, kAutoClickedFlagKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);

              XLog(@"[自动点击触发] 正在自动触发 T1TranslateButton 点击 (标题: %@)", title ?: @"显示翻译");

              dispatch_async(dispatch_get_main_queue(), ^{
                  BOOL curShowing = SafeCallBool(btn, NSSelectorFromString(@"showingTranslation"));
                  if (curShowing) return;

                  // 方式 1：调用官方私有点击入口 _didTap:forEvent:
                  SEL didTapSel = NSSelectorFromString(@"_didTap:forEvent:");
                  if ([btn respondsToSelector:didTapSel]) {
                      ((void(*)(id, SEL, id, id))objc_msgSend)(btn, didTapSel, btn, nil);
                      XLog(@"[自动点击成功] 已调用 _didTap:forEvent:");
                  }

                  // 方式 2：如果有 tapActionBlock，同时执行
                  if ([btn respondsToSelector:NSSelectorFromString(@"tapActionBlock")]) {
                      void (^block)(void) = ((id(*)(id, SEL))objc_msgSend)(btn, NSSelectorFromString(@"tapActionBlock"));
                      if (block) {
                          block();
                          XLog(@"[自动点击成功] 已执行 tapActionBlock");
                      }
                  }

                  // 方式 3：如果是 UIControl，发送点击事件
                  if ([btn isKindOfClass:[UIControl class]]) {
                      [(UIControl *)btn sendActionsForControlEvents:UIControlEventTouchUpInside];
                  }
              });
          }

          // 递归在视图树中寻找并触发所有可见的 T1TranslateButton
          static void ScanAndClickTranslateButtons(UIView *view) {
              if (!view) return;

              if ([NSStringFromClass([view class]) isEqualToString:@"T1TranslateButton"]) {
                  TriggerNativeClickOnButton(view);
                  return;
              }

              for (UIView *sub in view.subviews) {
                  ScanAndClickTranslateButtons(sub);
              }
          }

          // ==================== Hook 拦截点 ====================
          static BOOL CanHook(Class cls, SEL sel) {
              if (!cls || !sel) return NO;
              NSString *key = [NSString stringWithFormat:@"%@::%@", NSStringFromClass(cls), NSStringFromSelector(sel)];
              @synchronized (gHookedKeys) {
                  if ([gHookedKeys containsObject:key]) return NO;
                  [gHookedKeys addObject:key];
                  return YES;
              }
          }

          static void InstallClickHooks(void) {
              Class translateBtnCls = objc_getClass("T1TranslateButton");
              if (translateBtnCls) {
                  // 1. 当按钮进入屏幕/挂载到窗口时触发
                  SEL moveSel = @selector(didMoveToWindow);
                  if (CanHook(translateBtnCls, moveSel)) {
                      Method m = class_getInstanceMethod(translateBtnCls, moveSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(UIView *self) {
                              ((void(*)(id, SEL))orig)(self, moveSel);
                              if (self.window) {
                                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.05 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                                      TriggerNativeClickOnButton(self);
                                  });
                              }
                          }));
                          XLog(@"[Hook成功] T1TranslateButton -> didMoveToWindow");
                      }
                  }

                  // 2. 当按钮设置文字时（每次复用成“显示翻译”时重置并触发）
                  SEL setTitleSel = NSSelectorFromString(@"setTitleText:");
                  if (CanHook(translateBtnCls, setTitleSel)) {
                      Method m = class_getInstanceMethod(translateBtnCls, setTitleSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(UIView *self, NSString *text) {
                              ((void(*)(id, SEL, id))orig)(self, setTitleSel, text);
                              if (text && ([text containsString:@"翻译"] || [text containsString:@"Translate"])) {
                                  // 重置点击标记，允许对新推文重新点击
                                  objc_setAssociatedObject(self, kAutoClickedFlagKey, nil, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.05 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                                      TriggerNativeClickOnButton(self);
                                  });
                              }
                          }));
                          XLog(@"[Hook成功] T1TranslateButton -> setTitleText:");
                      }
                  }

                  // 3. 当按钮完成排版布局时触发
                  SEL layoutSel = @selector(layoutSubviews);
                  if (CanHook(translateBtnCls, layoutSel)) {
                      Method m = class_getInstanceMethod(translateBtnCls, layoutSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(UIView *self) {
                              ((void(*)(id, SEL))orig)(self, layoutSel);
                              if (self.window) {
                                  TriggerNativeClickOnButton(self);
                              }
                          }));
                          XLog(@"[Hook成功] T1TranslateButton -> layoutSubviews");
                      }
                  }
              }

              // 保持对时间线排版与 Grok 适配器的解锁，确保“显示翻译”持续存在于时间线上
              Class grokHelperCls = objc_getClass("T1GrokPostTranslationDisplayHelper");
              if (grokHelperCls) {
                  SEL mBtnSel = NSSelectorFromString(@"shouldDisplayManualTranslateButton");
                  if (CanHook(grokHelperCls, mBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, mBtnSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
                  SEL aBtnSel = NSSelectorFromString(@"shouldDisplayAutoTranslateButton");
                  if (CanHook(grokHelperCls, aBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, aBtnSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
                  SEL init1 = NSSelectorFromString(@"initWithStatusViewModel:account:forFocalView:");
                  if (CanHook(grokHelperCls, init1)) {
                      Method m = class_getInstanceMethod(grokHelperCls, init1);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^id(id self, id vm, id acc, BOOL focal) {
                              if (IsAutoTranslateEnabled()) focal = YES;
                              return ((id(*)(id, SEL, id, id, BOOL))orig)(self, init1, vm, acc, focal);
                          }));
                      }
                  }
              }

              Class translateAdapterCls = objc_getClass("T1StandardStatusTranslateAdapter");
              if (translateAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(translateAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                              if (IsAutoTranslateEnabled()) return YES;
                              return ((BOOL(*)(id, SEL, id))orig)(self, visSel, viewModel);
                          }));
                      }
                  }
              }

              Class grokBtnAdapterCls = objc_getClass("T1StandardStatusGrokTranslateButtonViewAdapter");
              if (grokBtnAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(grokBtnAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                              if (IsAutoTranslateEnabled()) return YES;
                              return ((BOOL(*)(id, SEL, id))orig)(self, visSel, viewModel);
                          }));
                      }
                  }
              }

              Class bodyAdapterCls = objc_getClass("T1ConversationTranslatedBodyAdapter");
              if (bodyAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  SEL transVMSel = NSSelectorFromString(@"translatedViewModelForViewModel:");
                  if (CanHook(bodyAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(bodyAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                              BOOL origVal = ((BOOL(*)(id, SEL, id))orig)(self, visSel, viewModel);
                              if (origVal) return YES;
                              if (IsAutoTranslateEnabled() && [self respondsToSelector:transVMSel]) {
                                  id transVM = ((id(*)(id, SEL, id))objc_msgSend)(self, transVMSel, viewModel);
                                  if (transVM != nil) return YES;
                              }
                              return NO;
                          }));
                      }
                  }
              }
          }

          // ==================== 悬浮球 & 菜单 ====================
          static void ShowSettingsMenu(void);

          @interface XFloatBtn : UIButton
          @property (nonatomic, assign) CGPoint startPoint;
          @end

          @implementation XFloatBtn
          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesBegan:touches withEvent:event];
              UITouch *t = [touches anyObject];
              self.startPoint = [t locationInView:self];
          }
          - (void)touchesMoved:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesMoved:touches withEvent:event];
              UITouch *t = [touches anyObject];
              CGPoint cur = [t locationInView:self.superview];
              self.center = CGPointMake(cur.x, cur.y);
          }
          - (void)onButtonClicked {
              ShowSettingsMenu();
          }
          @end

          static void ShowLogViewer(UIViewController *rootVC) {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];

              UIAlertController *logAlert = [UIAlertController alertControllerWithTitle:@"运行日志"
                                                                                message:fullLog.length > 0 ? fullLog : @"(暂无日志)"
                                                                         preferredStyle:UIAlertControllerStyleAlert];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"一键复制" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  [UIPasteboard generalPasteboard].string = fullLog;
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"导出为 TXT 文件" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *tmpPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"XAutoTranslate_Click.log"];
                  [fullLog writeToFile:tmpPath atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  NSURL *fileURL = [NSURL fileURLWithPath:tmpPath];
                  UIActivityViewController *actVC = [[UIActivityViewController alloc] initWithActivityItems:@[fileURL] applicationActivities:nil];
                  [rootVC presentViewController:actVC animated:YES completion:nil];
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"关闭" style:UIAlertActionStyleCancel handler:nil]];
              [rootVC presentViewController:logAlert animated:YES completion:nil];
          }

          static void ShowSettingsMenu(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  UIViewController *topVC = window.rootViewController;
                  while (topVC.presentedViewController) topVC = topVC.presentedViewController;
                  if (!topVC) return;

                  BOOL isEnabled = IsAutoTranslateEnabled();

                  NSString *title = [NSString stringWithFormat:@"原生全自动翻译 (当前: %@)", isEnabled ? @"✅ 开启" : @"❌ 关闭"];
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:title
                                                                                 message:@"时间线外语推文自动秒点翻译"
                                                                          preferredStyle:UIAlertControllerStyleActionSheet];

                  [alert addAction:[UIAlertAction actionWithTitle:(isEnabled ? @"暂停自动点击" : @"开启自动点击")
                                                             style:UIAlertActionStyleDefault
                                                           handler:^(UIAlertAction *action) {
                      [[NSUserDefaults standardUserDefaults] setBool:!isEnabled forKey:kPrefAutoTranslateEnabled];
                      [[NSUserDefaults standardUserDefaults] synchronize];
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"立即扫描并点击当前屏幕所有翻译按钮" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      for (UIWindow *w in [UIApplication sharedApplication].windows) {
                          ScanAndClickTranslateButtons(w);
                      }
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"查看与导出运行日志" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      ShowLogViewer(topVC);
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
                  [topVC presentViewController:alert animated:YES completion:nil];
              });
          }

          static void SetupFloatingButton(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  if (!window) return;

                  XFloatBtn *btn = [XFloatBtn buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(window.bounds.size.width - 55, window.bounds.size.height - 220, 44, 44);
                  [btn setTitle:@"🌐" forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont systemFontOfSize:22];
                  btn.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.65];
                  btn.layer.cornerRadius = 22;
                  btn.layer.masksToBounds = YES;
                  btn.layer.borderColor = [[UIColor whiteColor] colorWithAlphaComponent:0.3].CGColor;
                  btn.layer.borderWidth = 1.5;

                  [btn addTarget:btn action:@selector(onButtonClicked) forControlEvents:UIControlEventTouchUpInside];
                  [window addSubview:btn];
                  XLog(@"[UI] 悬浮控制球挂载完毕");
              });
          }

          // ==================== 构造入口与全局定时巡检器 ====================
          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gLogList = [[NSMutableArray alloc] init];
                  gLogLock = [[NSLock alloc] init];
                  gHookedKeys = [[NSMutableSet alloc] init];

                  XLog(@"=== XAutoTranslate (全自动点击引擎版) 启动 ===");

                  dispatch_async(dispatch_get_main_queue(), ^{
                      InstallClickHooks();
                      SetupFloatingButton();
                  });

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      InstallClickHooks();
                  });

                  // 启动轻量级雷达定时器（每 0.8 秒巡检当前窗口，发现可视的“显示翻译”立即点击）
                  dispatch_async(dispatch_get_main_queue(), ^{
                      [NSTimer scheduledTimerWithTimeInterval:0.8 repeats:YES block:^(NSTimer * _Nonnull timer) {
                          if (IsAutoTranslateEnabled()) {
                              for (UIWindow *w in [UIApplication sharedApplication].windows) {
                                  ScanAndClickTranslateButtons(w);
                              }
                          }
                      }];
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
