name: Build JailFools Dylib (Timeline Active Trigger)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Test model identity and wrapper traversal
        run: |
          xcrun -sdk macosx clang -fobjc-arc -framework Foundation \
            -Wall -Wextra -Werror tests/ModelSupportTests.m -o /tmp/XATModelSupportTests
          /tmp/XATModelSupportTests

      - name: Compile Dylib
        run: |
          mkdir -p output

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
