name: Build JailFools Dylib (R3 Diagnostics and Export)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <QuartzCore/QuartzCore.h>
          #import <CoreGraphics/CoreGraphics.h>
          #import <objc/runtime.h>
          #import <objc/message.h>
          #import <math.h>
          #import <stdarg.h>
          
          // UI state is accessed on the main thread; network caches are locked.
          static NSMutableDictionary *gHookIMPs;
          static NSMutableSet *gInFlight, *gTranslateClasses;
          static NSMutableDictionary *gTasks, *gTaskTokens, *gTaskStarted;
          static NSMutableDictionary *gErrors, *gFailures;
          static NSURLSession *gSession;
          static NSTimer *gTimer;
          static NSUInteger gRecoveryGeneration;
          static BOOL gRecovering;
          static NSMutableDictionary *gTextCache, *gLangCache, *gRetryAfter;
          static NSHashTable<UIView *> *gViews;
          static NSLock *gLock;
          static char kVM, kID, kStatus, kSavedAlpha, kOriginalBody, kBodyOverlay;
          static NSMutableSet *gShowOriginal;
          static NSMutableDictionary *gOriginalCache, *gFallbackIDs;
          static BOOL gEnforcing = NO;
          static void InspectAndTranslateView(UIView *view);
          static void InstallHooks(void);
          static void BeginVisibleDiscovery(void);
          static void ScanTrackedViews(void);
          
          static NSString *const kDiagnosticVersion=@"R3-Diagnostics";
          static dispatch_queue_t gLogQueue;
          static NSString *gLogDirectory;
          static NSISO8601DateFormatter *gLogClock;
          static NSUInteger gLogSequence;
          static char kDiagnosticState, kDiagnosticGesture;
          static NSDate *gServiceRetryUntil;
          static NSString *gServiceError;
          static NSUInteger gServiceFailures;
          static NSMutableSet *gWaitingForSlot;
          static NSMutableDictionary *gHookAvailability;
          static CFTimeInterval gNextRequestTime;
          
          static void XLog(NSString *format, ...) NS_FORMAT_FUNCTION(1,2);
          static void XLog(NSString *format, ...) {
              if (!gLogQueue) return;
              va_list args; va_start(args,format);
              NSString *message=[[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);
              NSDate *eventDate=NSDate.date;
              BOOL mainThread=NSThread.isMainThread;
              dispatch_async(gLogQueue,^{
                  @autoreleasepool {
                      NSString *current=[gLogDirectory stringByAppendingPathComponent:@"current.log"];
                      NSString *previous=[gLogDirectory stringByAppendingPathComponent:@"previous.log"];
                      NSFileManager *fm=NSFileManager.defaultManager;
                      unsigned long long bytes=[[fm attributesOfItemAtPath:current error:NULL] fileSize];
                      if (bytes>2*1024*1024) {
                          [fm removeItemAtPath:previous error:NULL];
                          [fm moveItemAtPath:current toPath:previous error:NULL];
                      }
                      if (![fm fileExistsAtPath:current]) [fm createFileAtPath:current contents:nil attributes:nil];
                      NSString *line=[NSString stringWithFormat:@"%@ #%lu thread=%@ %@\n",[gLogClock stringFromDate:eventDate],(unsigned long)++gLogSequence,mainThread ? @"main" : @"background",message];
                      NSFileHandle *file=[NSFileHandle fileHandleForWritingAtPath:current];
                      @try { [file seekToEndOfFile]; [file writeData:[line dataUsingEncoding:NSUTF8StringEncoding]]; }
                      @catch (NSException *exception) { NSLog(@"[XAutoTranslate] log write error: %@",exception.name); }
                      @finally { [file closeFile]; }
                  }
              });
          }
          static void InitializeDiagnosticLog(void) {
              gLogQueue=dispatch_queue_create("XAutoTranslate.diagnostic.log",DISPATCH_QUEUE_SERIAL);
              NSURL *root=[NSFileManager.defaultManager URLsForDirectory:NSApplicationSupportDirectory inDomains:NSUserDomainMask].firstObject;
              NSURL *folder=[root URLByAppendingPathComponent:@"XAutoTranslateLogs" isDirectory:YES];
              gLogDirectory=folder.path;
              NSError *error=nil;
              [NSFileManager.defaultManager createDirectoryAtURL:folder withIntermediateDirectories:YES attributes:nil error:&error];
              [folder setResourceValue:@YES forKey:NSURLIsExcludedFromBackupKey error:NULL];
              gLogClock=NSISO8601DateFormatter.new;
              gLogClock.formatOptions=NSISO8601DateFormatWithInternetDateTime|NSISO8601DateFormatWithFractionalSeconds;
              XLog(@"SESSION version=%@ app=%@ build=%@ os=%@ logDirectoryReady=%d",kDiagnosticVersion,
                  [NSBundle.mainBundle objectForInfoDictionaryKey:@"CFBundleShortVersionString"] ?: @"?",
                  [NSBundle.mainBundle objectForInfoDictionaryKey:@"CFBundleVersion"] ?: @"?",
                  NSProcessInfo.processInfo.operatingSystemVersionString,error==nil);
              XLog(@"CONFIG endpoint=translate.googleapis.com/translate_a/single client=gtx target=zh-CN concurrent=2 startSpacing=1s requestTimeout=20s resourceTimeout=30s watchdog=35s logRotation=2x2MiB");
              XLog(@"PRIVACY post text, translated text, full URLs, cookies, authorization headers, and credentials are excluded. Native crashes may require a system .ips report.");
          }
          static NSString *XPostKey(NSString *tid) {
              return tid.length ? [NSString stringWithFormat:@"%016lx",(unsigned long)tid.hash] : @"none";
          }
          static void XViewEvent(UIView *view, NSString *state, NSString *detail) {
              NSString *tid=objc_getAssociatedObject(view,&kID);
              NSString *signature=[NSString stringWithFormat:@"%@:%@",XPostKey(tid),state];
              if ([objc_getAssociatedObject(view,&kDiagnosticState) isEqualToString:signature]) return;
              objc_setAssociatedObject(view,&kDiagnosticState,signature,OBJC_ASSOCIATION_COPY_NONATOMIC);
              XLog(@"VIEW post=%@ class=%@ state=%@ %@",XPostKey(tid),NSStringFromClass(view.class),state,detail ?: @"");
          }
          static void DumpDiagnosticState(NSString *reason) {
              [gLock lock];
              NSUInteger active=gInFlight.count, cached=gTextCache.count, errors=gErrors.count;
              NSTimeInterval serviceWait=MAX(0,gServiceRetryUntil.timeIntervalSinceNow);
              NSArray *pending=gTaskStarted.allKeys;
              NSMutableArray *ages=NSMutableArray.new;
              for (NSString *tid in pending) {
                  [ages addObject:[NSString stringWithFormat:@"%@ age=%.1f",XPostKey(tid),-[(NSDate *)gTaskStarted[tid] timeIntervalSinceNow]]];
              }
              [gLock unlock];
              XLog(@"STATE reason=%@ appState=%ld timerValid=%d tracked=%lu hooks=%lu active=%lu cached=%lu errors=%lu serviceWait=%.1f generation=%lu discovery=%d pending=%@",
                  reason,(long)UIApplication.sharedApplication.applicationState,gTimer.isValid,
                  (unsigned long)gViews.allObjects.count,(unsigned long)gHookIMPs.count,(unsigned long)active,
                  (unsigned long)cached,(unsigned long)errors,serviceWait,(unsigned long)gRecoveryGeneration,gRecovering,ages);
              for (NSString *key in gHookIMPs.allKeys) {
                  NSArray *parts=[key componentsSeparatedByString:@"::"];
                  if (parts.count!=2) continue;
                  Class cls=NSClassFromString(parts[0]); SEL sel=NSSelectorFromString(parts[1]);
                  Method method=class_getInstanceMethod(cls,sel);
                  BOOL matches=method && method_getImplementation(method)==(IMP)[gHookIMPs[key] pointerValue];
                  XLog(@"HOOK_STATE method=%@ installed=%d",key,matches);
              }
          }
          static UIViewController *DiagnosticPresenter(UIView *source) {
              UIViewController *controller=source.window.rootViewController;
              if (!controller) {
                  for (UIScene *scene in UIApplication.sharedApplication.connectedScenes) {
                      if (![scene isKindOfClass:UIWindowScene.class] || scene.activationState!=UISceneActivationStateForegroundActive) continue;
                      for (UIWindow *window in ((UIWindowScene *)scene).windows) {
                          if (window.isKeyWindow) { controller=window.rootViewController; break; }
                      }
                      if (controller) break;
                  }
              }
              while (controller) {
                  if (controller.presentedViewController && !controller.presentedViewController.isBeingDismissed) controller=controller.presentedViewController;
                  else if ([controller isKindOfClass:UINavigationController.class]) controller=((UINavigationController *)controller).visibleViewController;
                  else if ([controller isKindOfClass:UITabBarController.class]) controller=((UITabBarController *)controller).selectedViewController;
                  else break;
              }
              return controller;
          }
          static void ExportDiagnosticLog(UIViewController *presenter, UIView *source) {
              DumpDiagnosticState(@"export");
              dispatch_async(gLogQueue,^{
                  NSMutableData *snapshot=NSMutableData.new;
                  [snapshot appendData:[@"XAutoTranslate diagnostic log\nNo post text, credentials or full request URLs.\n\n" dataUsingEncoding:NSUTF8StringEncoding]];
                  for (NSString *name in @[@"previous.log",@"current.log"]) {
                      NSData *data=[NSData dataWithContentsOfFile:[gLogDirectory stringByAppendingPathComponent:name]];
                      if (data.length) {
                          [snapshot appendData:[[NSString stringWithFormat:@"\n--- %@ ---\n",name] dataUsingEncoding:NSUTF8StringEncoding]];
                          [snapshot appendData:data];
                      }
                  }
                  NSString *name=[NSString stringWithFormat:@"XAutoTranslate-%@-%lld.log",kDiagnosticVersion,(long long)NSDate.date.timeIntervalSince1970];
                  NSURL *url=[NSURL fileURLWithPath:[NSTemporaryDirectory() stringByAppendingPathComponent:name]];
                  NSError *error=nil;
                  BOOL written=[snapshot writeToURL:url options:NSDataWritingAtomic error:&error];
                  dispatch_async(dispatch_get_main_queue(),^{
                      if (!presenter.view.window) return;
                      if (!written) {
                          UIAlertController *alert=[UIAlertController alertControllerWithTitle:@"日志导出失败" message:@"无法创建日志文件，请检查可用存储空间。" preferredStyle:UIAlertControllerStyleAlert];
                          [alert addAction:[UIAlertAction actionWithTitle:@"确定" style:UIAlertActionStyleCancel handler:nil]];
                          [presenter presentViewController:alert animated:YES completion:nil];
                          return;
                      }
                      UIActivityViewController *share=[[UIActivityViewController alloc] initWithActivityItems:@[url] applicationActivities:nil];
                      UIView *anchor=source.window ? source : presenter.view;
                      if (share.popoverPresentationController) {
                          share.popoverPresentationController.sourceView=anchor;
                          share.popoverPresentationController.sourceRect=anchor.bounds;
                      }
                      [presenter presentViewController:share animated:YES completion:nil];
                  });
              });
          }
          static void PresentDiagnosticMenu(UIView *source) {
              UIViewController *presenter=DiagnosticPresenter(source);
              if (!presenter || [presenter isKindOfClass:UIAlertController.class] || [presenter isKindOfClass:UIActivityViewController.class]) return;
              XLog(@"DIAGNOSTIC_MENU opened=1 version=%@",kDiagnosticVersion);
              UIAlertController *menu=[UIAlertController alertControllerWithTitle:[@"翻译诊断 · " stringByAppendingString:kDiagnosticVersion]
                  message:@"记录请求、HTTP 状态、网络错误、Hook、视图定位、缓存与前后台状态；不记录帖子正文。底层崩溃可能还需要系统 .ips 报告。" preferredStyle:UIAlertControllerStyleAlert];
              [menu addAction:[UIAlertAction actionWithTitle:@"导出日志" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action){
                  [presenter dismissViewControllerAnimated:YES completion:^{ ExportDiagnosticLog(presenter,source); }];
              }]];
              [menu addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
              [presenter presentViewController:menu animated:YES completion:nil];
          }
          @interface XDiagnosticGestureTarget : NSObject <UIGestureRecognizerDelegate>
          - (void)showLogs:(UILongPressGestureRecognizer *)gesture;
          @end
          @implementation XDiagnosticGestureTarget
          - (void)showLogs:(UILongPressGestureRecognizer *)gesture {
              if (gesture.state==UIGestureRecognizerStateBegan) PresentDiagnosticMenu(gesture.view);
          }
          - (BOOL)gestureRecognizer:(UIGestureRecognizer *)gesture shouldRecognizeSimultaneouslyWithGestureRecognizer:(UIGestureRecognizer *)other { return YES; }
          @end
          static XDiagnosticGestureTarget *gDiagnosticGestures;
          static void AttachDiagnosticGesture(UIView *view, NSUInteger fingers) {
              if (objc_getAssociatedObject(view,&kDiagnosticGesture)) return;
              UILongPressGestureRecognizer *gesture=[[UILongPressGestureRecognizer alloc] initWithTarget:gDiagnosticGestures action:@selector(showLogs:)];
              gesture.numberOfTouchesRequired=fingers; gesture.minimumPressDuration=1.0;
              gesture.cancelsTouchesInView=(fingers==1); gesture.delegate=gDiagnosticGestures;
              [view addGestureRecognizer:gesture];
              objc_setAssociatedObject(view,&kDiagnosticGesture,gesture,OBJC_ASSOCIATION_RETAIN_NONATOMIC);
          }
          static NSTimeInterval MetricDuration(NSDate *start, NSDate *end) { return start && end ? [end timeIntervalSinceDate:start] : -1; }
          @interface XNetworkMetrics : NSObject <NSURLSessionTaskDelegate>
          @end
          @implementation XNetworkMetrics
          - (void)URLSession:(NSURLSession *)session task:(NSURLSessionTask *)task didFinishCollectingMetrics:(NSURLSessionTaskMetrics *)metrics {
              XLog(@"METRICS %@ total=%.3f redirects=%lu transactions=%lu",task.taskDescription ?: @"unknown",metrics.taskInterval.duration,(unsigned long)metrics.redirectCount,(unsigned long)metrics.transactionMetrics.count);
              for (NSURLSessionTaskTransactionMetrics *m in metrics.transactionMetrics) {
                  XLog(@"NETWORK %@ protocol=%@ reused=%d proxy=%d fetch=%ld dns=%.3f connect=%.3f tls=%.3f response=%.3f",
                      task.taskDescription ?: @"unknown",m.networkProtocolName ?: @"unknown",m.isReusedConnection,m.isProxyConnection,(long)m.resourceFetchType,
                      MetricDuration(m.domainLookupStartDate,m.domainLookupEndDate),MetricDuration(m.connectStartDate,m.connectEndDate),
                      MetricDuration(m.secureConnectionStartDate,m.secureConnectionEndDate),MetricDuration(m.requestStartDate,m.responseEndDate));
              }
          }
          @end
          static XNetworkMetrics *gNetworkMetrics;
          static NSTimeInterval RetryAfterSeconds(NSHTTPURLResponse *response) {
              NSString *value=[response valueForHTTPHeaderField:@"Retry-After"];
              if (!value.length) return 0;
              NSScanner *scanner=[NSScanner scannerWithString:value]; double seconds=0;
              if ([scanner scanDouble:&seconds] && scanner.isAtEnd && isfinite(seconds)) return MAX(0,seconds);
              NSDateFormatter *formatter=NSDateFormatter.new;
              formatter.locale=[[NSLocale alloc] initWithLocaleIdentifier:@"en_US_POSIX"];
              formatter.timeZone=[NSTimeZone timeZoneForSecondsFromGMT:0];
              formatter.dateFormat=@"EEE, dd MMM yyyy HH:mm:ss zzz";
              return MAX(0,[[formatter dateFromString:value] timeIntervalSinceNow]);
          }
          
          @interface XTranslationSource : NSObject
          @property(nonatomic, copy) NSString *text;
          @end
          @implementation XTranslationSource
          @end
          static const NSInteger kBodyTag = 998872, kStatusTag = 998873;
          
          @interface XTranslationButton : UIButton
          @property(nonatomic, weak) UIView *translationView;
          - (void)toggleOriginal;
          @end
          @implementation XTranslationButton
          - (void)toggleOriginal {
              UIView *view=self.translationView;
              NSString *tid=objc_getAssociatedObject(view,&kID);
              if (!tid) return;
              [gLock lock]; BOOL translated=[gTextCache[tid] length]>0;
              if (!translated) { [gRetryAfter removeObjectForKey:tid]; [gErrors removeObjectForKey:tid]; }
              [gLock unlock];
              XLog(@"USER post=%@ action=%@",XPostKey(tid),translated ? @"toggle-original" : @"retry");
              if (!translated) { InspectAndTranslateView(view); return; }
              if ([gShowOriginal containsObject:tid]) [gShowOriginal removeObject:tid];
              else [gShowOriginal addObject:tid];
              for (UIView *candidate in gViews.allObjects) {
                  if ([objc_getAssociatedObject(candidate,&kID) isEqualToString:tid]) InspectAndTranslateView(candidate);
              }
          }
          @end
          
          @interface XTopAlignedLabel : UILabel
          @property(nonatomic, weak) UIView *translationView;
          @end
          @implementation XTopAlignedLabel
          - (void)drawTextInRect:(CGRect)rect {
              CGRect r = [self textRectForBounds:rect limitedToNumberOfLines:self.numberOfLines];
              r.origin.y = rect.origin.y;
              [super drawTextInRect:r];
          }
          @end
          
          static id SafeCallObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *s = [obj methodSignatureForSelector:sel];
              if (!s || s.numberOfArguments != 2 || s.methodReturnType[0] != '@') return nil;
              @try { return ((id(*)(id, SEL))objc_msgSend)(obj, sel); }
              @catch (NSException *exception) {
                  XLog(@"MODEL_EXCEPTION class=%@ selector=%@ name=%@ stack=%@",NSStringFromClass([obj class]),NSStringFromSelector(sel),exception.name,[exception.callStackSymbols componentsJoinedByString:@" | "]);
                  return nil;
              }
          }
          static NSString *FriendlyLanguageName(NSString *code) {
              if (![code isKindOfClass:NSString.class] || !code.length) return @"外语";
              NSString *c = code.lowercaseString;
              NSArray *codes = @[@"en",@"ko",@"ja",@"fr",@"de",@"es",@"ru",@"ar",@"pt",@"it",@"th",@"vi",@"tr",@"id",@"nl"];
              NSArray *names = @[@"英语",@"韩语",@"日语",@"法语",@"德语",@"西班牙语",@"俄语",@"阿拉伯语",@"葡萄牙语",@"意大利语",@"泰语",@"越南语",@"土耳其语",@"印尼语",@"荷兰语"];
              for (NSUInteger i=0; i<codes.count; i++) if ([c hasPrefix:codes[i]]) return names[i];
              return @"外语";
          }
          static BOOL IsValidForeignText(NSString *raw) {
              if (!raw.length) return NO;
              NSUInteger han=0, kana=0, foreign=0, words=0;
              NSMutableString *clean = NSMutableString.new;
              for (NSString *w in [raw componentsSeparatedByCharactersInSet:NSCharacterSet.whitespaceAndNewlineCharacterSet]) {
                  if (!w.length || [w hasPrefix:@"http://"] || [w hasPrefix:@"https://"] || [w hasPrefix:@"@"] || [w hasPrefix:@"#"]) continue;
                  words++; [clean appendString:w];
              }
              for (NSUInteger i=0; i<clean.length; i++) {
                  unichar c = [clean characterAtIndex:i];
                  if ((c>=0x3040 && c<=0x30FF) || (c>=0x31F0 && c<=0x31FF) || (c>=0xAC00 && c<=0xD7AF)) { kana++; foreign++; }
                  else if (c>=0x4E00 && c<=0x9FFF) han++;
                  else if ((c>='a' && c<='z') || (c>='A' && c<='Z') || (c>=0x00C0 && c<=0x024F) || (c>=0x0400 && c<=0x06FF)) foreign++;
              }
              if (kana>=2) return YES;
              NSUInteger total=han+foreign;
              if (total<4 || (words<2 && foreign<6)) return NO;
              if (han && (double)han/total>=0.20) return NO;
              return foreign>=4;
          }
          // Bound recursion and detect cycles in private model graphs.
          static NSArray *SubKeys(void) { return @[@"statusViewModel",@"representedStatus",@"status",@"tweet",@"conversationNode"]; }
          static NSString *RawTextWalk(id obj, NSHashTable *seen, NSUInteger depth) {
              if (!obj || depth>10 || [seen containsObject:obj]) return nil;
              [seen addObject:obj];
              for (NSString *key in @[@"displayText",@"text",@"fullText",@"renderedText"]) {
                  id v=SafeCallObject(obj, NSSelectorFromString(key));
                  if ([v isKindOfClass:NSString.class] && [v length]) return v;
              }
              for (NSString *key in SubKeys()) {
                  NSString *v=RawTextWalk(SafeCallObject(obj, NSSelectorFromString(key)),seen,depth+1);
                  if (v.length) return v;
              }
              return nil;
          }
          static NSHashTable *IdentitySet(void) { return [NSHashTable hashTableWithOptions:NSPointerFunctionsStrongMemory|NSPointerFunctionsObjectPointerPersonality]; }
          static NSString *ExtractModelRawText(id obj) { return RawTextWalk(obj,IdentitySet(),0); }
          static BOOL IsForeignTranslatableViewModel(id obj) {
              if (!obj) return NO;
              for (NSString *key in @[@"originalLanguage",@"language",@"lang"]) {
                  id v=SafeCallObject(obj,NSSelectorFromString(key));
                  if ([v isKindOfClass:NSString.class]) {
                      NSString *c=[v lowercaseString];
                      if ([c hasPrefix:@"zh"] || [@[@"und",@"zxx",@"qme",@"qam",@"qht",@"qst",@"art"] containsObject:c]) return NO;
                  }
              }
              NSString *text=ExtractModelRawText(obj);
              return text ? IsValidForeignText(text) : YES;
          }
          static NSString *IDWalk(id obj, NSHashTable *seen, NSUInteger depth) {
              if (!obj || depth>10 || [seen containsObject:obj]) return nil;
              [seen addObject:obj];
              for (NSString *key in @[@"statusIDString",@"statusID",@"tweetIDString",@"tweetID",@"focalStatusID",@"entryID"]) {
                  SEL sel=NSSelectorFromString(key);
                  if (![obj respondsToSelector:sel]) continue;
                  NSMethodSignature *s=[obj methodSignatureForSelector:sel];
                  if (!s || s.numberOfArguments!=2) continue;
                  if (s.methodReturnType[0]=='@') {
                      id v=((id(*)(id,SEL))objc_msgSend)(obj,sel);
                      if ([v isKindOfClass:NSString.class] && [v length]) return v;
                      if ([v isKindOfClass:NSNumber.class]) return [v stringValue];
                  } else if (s.methodReturnType[0]=='q') {
                      long long v=((long long(*)(id,SEL))objc_msgSend)(obj,sel);
                      if (v>0) return [NSString stringWithFormat:@"%lld",v];
                  } else if (s.methodReturnType[0]=='Q') {
                      unsigned long long v=((unsigned long long(*)(id,SEL))objc_msgSend)(obj,sel);
                      if (v>0) return [NSString stringWithFormat:@"%llu",v];
                  }
              }
              for (NSString *key in SubKeys()) {
                  NSString *v=IDWalk(SafeCallObject(obj,NSSelectorFromString(key)),seen,depth+1);
                  if (v) return v;
              }
              return nil;
          }
          static NSString *ExtractRealTweetID(id obj) {
              NSString *v=IDWalk(obj,IdentitySet(),0);
              if (v) return v;
              NSString *text=ExtractModelRawText(obj);
              if (!text.length) return [NSString stringWithFormat:@"ptr:%p",obj];
              [gLock lock]; NSString *known=gFallbackIDs[text]; [gLock unlock];
              return known ?: [@"text:" stringByAppendingString:text];
          }
          static void CollectSubviews(UIView *view, NSMutableArray *out) {
              for (UIView *sub in view.subviews) { [out addObject:sub]; CollectSubviews(sub,out); }
          }
          static UIView *FindTweetContainerView(UIView *view) {
              UIView *best=view.superview;
              for (UIView *cur=view.superview; cur && ![cur isKindOfClass:UIWindow.class]; cur=cur.superview) {
                  NSString *name=NSStringFromClass(cur.class);
                  if ([cur isKindOfClass:UITableViewCell.class] || [cur isKindOfClass:UICollectionViewCell.class] || [name containsString:@"StatusView"] || [name containsString:@"Cell"]) return cur;
                  if (cur.bounds.size.width>200 && cur.bounds.size.height>45) best=cur;
              }
              return best;
          }
          static UIColor *ResolveBackgroundColor(UIView *view) {
              for (UIView *cur=view; cur && ![cur isKindOfClass:UIWindow.class]; cur=cur.superview) {
                  UIColor *c=cur.backgroundColor; CGFloat alpha=0;
                  if (([c getRed:NULL green:NULL blue:NULL alpha:&alpha] || [c getWhite:NULL alpha:&alpha]) && alpha>0.9) return c;
              }
              return UIColor.systemBackgroundColor;
          }
          static NSString *ExtractTextFromView(UIView *view) {
              NSString *saved=objc_getAssociatedObject(view,&kOriginalBody);
              if (saved.length) return saved;
              id model=SafeCallObject(view,NSSelectorFromString(@"attributedTextModel")) ?: SafeCallObject(view,NSSelectorFromString(@"textModel"));
              id attr=SafeCallObject(model,NSSelectorFromString(@"attributedString")) ?: SafeCallObject(view,NSSelectorFromString(@"attributedText")) ?: SafeCallObject(view,NSSelectorFromString(@"attributedString"));
              if ([attr isKindOfClass:NSAttributedString.class] && [attr length]) return [attr string];
              id text=SafeCallObject(view,NSSelectorFromString(@"text")) ?: SafeCallObject(view,NSSelectorFromString(@"titleText"));
              if ([text isKindOfClass:NSString.class] && [text length]) return text;
              return view.accessibilityLabel;
          }
          static UIView *FindBodyTextViewInContainer(UIView *container, UIView *translate, NSString **outText) {
              if (!container || !translate) return nil;
              CGRect tr=[translate convertRect:translate.bounds toView:container];
              NSMutableArray *subs=NSMutableArray.new; CollectSubviews(container,subs);
              UIView *best=nil; NSString *text=nil; CGFloat distance=CGFLOAT_MAX;
              for (UIView *sub in subs) {
                  if (sub==translate || [sub isDescendantOfView:translate] || sub.tag==kBodyTag || sub.tag==kStatusTag || sub.hidden || sub.alpha<0.01) continue;
                  CGRect r=[sub convertRect:sub.bounds toView:container]; CGFloat dy=r.origin.y-tr.origin.y;
                  if (r.size.width<100 || r.size.height<14 || dy< -4 || dy>90) continue;
                  NSString *name=NSStringFromClass(sub.class);
                  if (![name containsString:@"AttributedTextView"] && ![name containsString:@"BodyView"] && ![name containsString:@"TextView"] && ![sub isKindOfClass:UILabel.class]) continue;
                  NSString *candidate=ExtractTextFromView(sub);
                  if ((IsValidForeignText(candidate) || objc_getAssociatedObject(sub,&kOriginalBody)) && dy<distance) { best=sub; text=candidate; distance=dy; }
              }
              if (outText) *outText=text;
              return best;
          }
          
          // Hide native text and leading icon; preserve the original button hit area.
          static void RestoreNativeText(UIView *view) {
              NSMutableArray *subs=[NSMutableArray arrayWithObject:view]; CollectSubviews(view,subs);
              for (UIView *sub in subs) {
