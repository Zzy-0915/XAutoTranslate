name: Build JailFools Dylib (With UI & Logger)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // ==================== 全局状态与日志管理器 ====================
          static NSMutableArray<NSString *> *gLogList = nil;
          static NSLock *gLogLock = nil;
          static NSCache *gTranslationCache = nil;
          static NSMutableSet *gPendingRequests = nil;
          static dispatch_queue_t gTranslateQueue = nil;

          static NSString *const kPrefAutoTranslateEnabled = @"XAutoTranslate_Enabled";
          static NSString *const kPrefTranslationMode = @"XAutoTranslate_Mode";

          static void XLog(NSString *format, ...) {
              va_list args;
              va_start(args, format);
              NSString *msg = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);

              NSDateFormatter *df = [[NSDateFormatter alloc] init];
              [df setDateFormat:@"HH:mm:ss.SSS"];
              NSString *timestamp = [df stringFromDate:[NSDate date]];
              NSString *logEntry = [NSString stringWithFormat:@"[%@] %@", timestamp, msg];

              NSLog(@"[XAutoTranslate] %@", logEntry);

              [gLogLock lock];
              if (!gLogList) gLogList = [NSMutableArray array];
              [gLogList addObject:logEntry];
              if (gLogList.count > 600) [gLogList removeObjectAtIndex:0];
              [gLogLock unlock];
          }

          static BOOL IsAutoTranslateEnabled(void) {
              id val = [[NSUserDefaults standardUserDefaults] objectForKey:kPrefAutoTranslateEnabled];
              return val ? [val boolValue] : YES;
          }

          static NSInteger GetTranslationMode(void) {
              return [[NSUserDefaults standardUserDefaults] integerForKey:kPrefTranslationMode];
          }

          // 遍历并重载屏幕上所有集合与列表视图
          static void ReloadAllTimelineViews(UIView *view) {
              if (!view) return;
              if ([view isKindOfClass:[UICollectionView class]]) {
                  [((UICollectionView *)view) reloadData];
              } else if ([view isKindOfClass:[UITableView class]]) {
                  [((UITableView *)view) reloadData];
              }
              for (UIView *sub in view.subviews) {
                  ReloadAllTimelineViews(sub);
              }
          }

          static void TriggerTimelineRefresh(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *targetWindow = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { targetWindow = w; break; }
                  }
                  if (!targetWindow) targetWindow = [UIApplication sharedApplication].windows.firstObject;
                  if (targetWindow) ReloadAllTimelineViews(targetWindow);
              });
          }

          // 异步翻译逻辑
          static void RequestTranslation(NSString *text, NSString *statusID) {
              if (!text || text.length == 0 || !statusID) return;

              @synchronized (gPendingRequests) {
                  if ([gPendingRequests containsObject:statusID]) return;
                  [gPendingRequests addObject:statusID];
              }

              XLog(@"发起翻译 -> ID: %@, 原文: %.25@...", statusID, text);

              dispatch_async(gTranslateQueue, ^{
                  // 转义 URLQuery 允许的特殊字符，避免 # 话题标签和 & 符号截断 URL
                  NSMutableCharacterSet *allowed = [[NSCharacterSet URLQueryAllowedCharacterSet] mutableCopy];
                  [allowed removeCharactersInString:@"#+&?="];
                  NSString *encodedText = [text stringByAddingPercentEncodingWithAllowedCharacters:allowed];
                  
                  NSString *urlString = [NSString stringWithFormat:@"https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=%@", encodedText];
                  NSMutableURLRequest *request = [NSMutableURLRequest requestWithURL:[NSURL URLWithString:urlString]];
                  [request setValue:@"Mozilla/5.0 (iPhone; CPU iPhone OS 17_2 like Mac OS X)" forHTTPHeaderField:@"User-Agent"];
                  request.timeoutInterval = 8.0;

                  NSURLSessionDataTask *task = [[NSURLSession sharedSession] dataTaskWithRequest:request completionHandler:^(NSData *data, NSURLResponse *response, NSError *error) {
                      @synchronized (gPendingRequests) {
                          [gPendingRequests removeObject:statusID];
                      }

                      if (error) {
                          XLog(@"[请求异常] 网络错误: %@ (请确认代理分流设置)", error.localizedDescription);
                          return;
                      }

                      NSHTTPURLResponse *httpResp = (NSHTTPURLResponse *)response;
                      if (httpResp.statusCode != 200) {
                          XLog(@"[接口返回非200] 状态码: %ld", (long)httpResp.statusCode);
                          return;
                      }

                      NSError *jsonErr = nil;
                      id json = [NSJSONSerialization JSONObjectWithData:data options:0 error:&jsonErr];
                      if (!jsonErr && [json isKindOfClass:[NSArray class]] && [json count] > 0) {
                          NSArray *segments = json[0];
                          NSMutableString *translatedFull = [NSMutableString string];
                          
                          if ([segments isKindOfClass:[NSArray class]]) {
                              for (id seg in segments) {
                                  if ([seg isKindOfClass:[NSArray class]] && [seg count] > 0) {
                                      [translatedFull appendString:seg[0]];
                                  }
                              }
                          }

                          if (translatedFull.length > 0) {
                              XLog(@"[翻译成功] ID: %@ -> 译文: %.30@...", statusID, translatedFull);
                              [gTranslationCache setObject:[translatedFull copy] forKey:statusID];
                              TriggerTimelineRefresh();
                          }
                      } else {
                          XLog(@"[解析失败] 数据格式无法解析");
                      }
                  }];
                  [task resume];
              });
          }

          // 核心文本替换处理
          static NSString *ProcessTranslatedText(NSString *orig, NSString *sid) {
              if (!IsAutoTranslateEnabled()) return orig;
              if (!orig || orig.length == 0 || !sid || [sid isEqualToString:@"0"]) return orig;

              NSString *cached = [gTranslationCache objectForKey:sid];
              if (cached) {
                  if ([cached isEqualToString:orig]) return orig;
                  if (GetTranslationMode() == 1) {
                      return cached; // 纯中文模式
                  }
                  return [NSString stringWithFormat:@"%@\n\n🇨🇳 [自动翻译]\n%@", orig, cached];
              }

              RequestTranslation(orig, sid);
              return orig;
          }

          // ==================== Hook 拦截点 ====================
          static NSString *(*orig_status_primaryText)(id, SEL) = NULL;
          static NSString *hook_status_primaryText(id self, SEL _cmd) {
              NSString *orig = orig_status_primaryText ? orig_status_primaryText(self, _cmd) : nil;
              NSString *sid = nil;
              if ([self respondsToSelector:@selector(statusIDString)]) {
                  sid = ((NSString *(*)(id, SEL))objc_msgSend)(self, @selector(statusIDString));
              }
              if (!sid && [self respondsToSelector:@selector(statusID)]) {
                  long long sidVal = ((long long (*)(id, SEL))objc_msgSend)(self, @selector(statusID));
                  if (sidVal != 0) sid = [NSString stringWithFormat:@"%lld", sidVal];
              }
              return ProcessTranslatedText(orig, sid);
          }

          static NSString *(*orig_status_displayText)(id, SEL) = NULL;
          static NSString *hook_status_displayText(id self, SEL _cmd) {
              NSString *orig = orig_status_displayText ? orig_status_displayText(self, _cmd) : nil;
              NSString *sid = nil;
              if ([self respondsToSelector:@selector(statusIDString)]) {
                  sid = ((NSString *(*)(id, SEL))objc_msgSend)(self, @selector(statusIDString));
              }
              return ProcessTranslatedText(orig, sid);
          }

          static NSString *(*orig_vm_primaryText)(id, SEL) = NULL;
          static NSString *hook_vm_primaryText(id self, SEL _cmd) {
              NSString *orig = orig_vm_primaryText ? orig_vm_primaryText(self, _cmd) : nil;
              NSString *sid = nil;
              if ([self respondsToSelector:@selector(status)]) {
                  id status = ((id (*)(id, SEL))objc_msgSend)(self, @selector(status));
                  if (status && [status respondsToSelector:@selector(statusIDString)]) {
                      sid = ((NSString *(*)(id, SEL))objc_msgSend)(status, @selector(statusIDString));
                  }
              }
              return ProcessTranslatedText(orig, sid);
          }

          static NSString *(*orig_vm_displayText)(id, SEL) = NULL;
          static NSString *hook_vm_displayText(id self, SEL _cmd) {
              NSString *orig = orig_vm_displayText ? orig_vm_displayText(self, _cmd) : nil;
              NSString *sid = nil;
              if ([self respondsToSelector:@selector(status)]) {
                  id status = ((id (*)(id, SEL))objc_msgSend)(self, @selector(status));
                  if (status && [status respondsToSelector:@selector(statusIDString)]) {
                      sid = ((NSString *(*)(id, SEL))objc_msgSend)(status, @selector(statusIDString));
                  }
              }
              return ProcessTranslatedText(orig, sid);
          }

          static void HookMethod(Class cls, SEL sel, IMP newImp, IMP *origImp) {
              if (!cls) return;
              Method m = class_getInstanceMethod(cls, sel);
              if (m) {
                  *origImp = method_getImplementation(m);
                  method_setImplementation(m, newImp);
                  XLog(@"[Hook成功] %@ -> %@", NSStringFromClass(cls), NSStringFromSelector(sel));
              }
          }

          // ==================== 悬浮球 & 菜单 ====================
          static void ShowSettingsMenu(void);

          @interface XFloatBtn : UIButton
          @property (nonatomic, assign) CGPoint startPoint;
          @end

          @implementation XFloatBtn
          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesBegan:touches withEvent:event];
              UITouch *t = [touches anyObject];
              self.startPoint = [t locationInView:self];
          }
          - (void)touchesMoved:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesMoved:touches withEvent:event];
              UITouch *t = [touches anyObject];
              CGPoint cur = [t locationInView:self.superview];
              self.center = CGPointMake(cur.x, cur.y);
          }
          - (void)onButtonClicked {
              ShowSettingsMenu();
          }
          @end

          static void ShowLogViewer(UIViewController *rootVC) {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];

              UIAlertController *logAlert = [UIAlertController alertControllerWithTitle:@"运行日志"
                                                                                message:fullLog.length > 0 ? fullLog : @"(暂无日志)"
                                                                         preferredStyle:UIAlertControllerStyleAlert];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"一键复制" style:UIAlertActionStyleDefault handler:^(UIAlertAction * _Nonnull action) {
                  [UIPasteboard generalPasteboard].string = fullLog;
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"导出为 TXT 文件" style:UIAlertActionStyleDefault handler:^(UIAlertAction * _Nonnull action) {
                  NSString *tmpPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"XAutoTranslate.log"];
                  [fullLog writeToFile:tmpPath atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  NSURL *fileURL = [NSURL fileURLWithPath:tmpPath];
                  UIActivityViewController *actVC = [[UIActivityViewController alloc] initWithActivityItems:@[fileURL] applicationActivities:nil];
                  [rootVC presentViewController:actVC animated:YES completion:nil];
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"关闭" style:UIAlertActionStyleCancel handler:nil]];
              [rootVC presentViewController:logAlert animated:YES completion:nil];
          }

          static void ShowSettingsMenu(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  UIViewController *topVC = window.rootViewController;
                  while (topVC.presentedViewController) topVC = topVC.presentedViewController;
                  if (!topVC) return;

                  BOOL isEnabled = IsAutoTranslateEnabled();
                  NSInteger curMode = GetTranslationMode();

                  NSString *title = [NSString stringWithFormat:@"自动翻译设置 (当前: %@)", isEnabled ? @"✅ 开启" : @"❌ 关闭"];
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:title
                                                                                 message:@"可调整翻译显示模式或查看排查日志"
                                                                          preferredStyle:UIAlertControllerStyleActionSheet];

                  [alert addAction:[UIAlertAction actionWithTitle:(isEnabled ? @"暂停自动翻译" : @"开启自动翻译")
                                                             style:UIAlertActionStyleDefault
                                                           handler:^(UIAlertAction * _Nonnull action) {
                      [[NSUserDefaults standardUserDefaults] setBool:!isEnabled forKey:kPrefAutoTranslateEnabled];
                      [[NSUserDefaults standardUserDefaults] synchronize];
                      TriggerTimelineRefresh();
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:(curMode == 0 ? @"切换为：仅显示译文" : @"切换为：原文+译文双语")
                                                             style:UIAlertActionStyleDefault
                                                           handler:^(UIAlertAction * _Nonnull action) {
                      [[NSUserDefaults standardUserDefaults] setInteger:(curMode == 0 ? 1 : 0) forKey:kPrefTranslationMode];
                      [[NSUserDefaults standardUserDefaults] synchronize];
                      TriggerTimelineRefresh();
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"强制刷新当前界面" style:UIAlertActionStyleDefault handler:^(UIAlertAction * _Nonnull action) {
                      TriggerTimelineRefresh();
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"查看与导出运行日志" style:UIAlertActionStyleDefault handler:^(UIAlertAction * _Nonnull action) {
                      ShowLogViewer(topVC);
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
                  [topVC presentViewController:alert animated:YES completion:nil];
              });
          }

          static void SetupFloatingButton(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  if (!window) return;

                  XFloatBtn *btn = [XFloatBtn buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(window.bounds.size.width - 55, window.bounds.size.height - 220, 44, 44);
                  [btn setTitle:@"🌐" forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont systemFontOfSize:22];
                  btn.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.65];
                  btn.layer.cornerRadius = 22;
                  btn.layer.masksToBounds = YES;
                  btn.layer.borderColor = [[UIColor whiteColor] colorWithAlphaComponent:0.3].CGColor;
                  btn.layer.borderWidth = 1.5;

                  [btn addTarget:btn action:@selector(onButtonClicked) forControlEvents:UIControlEventTouchUpInside];
                  [window addSubview:btn];
                  XLog(@"[UI] 悬浮球挂载成功");
              });
          }

          // ==================== 构造入口 ====================
          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gLogList = [[NSMutableArray alloc] init];
                  gLogLock = [[NSLock alloc] init];
                  gTranslationCache = [[NSCache alloc] init];
                  gTranslationCache.countLimit = 600;
                  gPendingRequests = [[NSMutableSet alloc] init];
                  gTranslateQueue = dispatch_queue_create("com.hook.x.autotranslate", DISPATCH_QUEUE_SERIAL);

                  XLog(@"=== XAutoTranslate 插件初始化启动 ===");

                  dispatch_async(dispatch_get_main_queue(), ^{
                      Class statusCls = objc_getClass("TFNTwitterStatus");
                      if (statusCls) {
                          HookMethod(statusCls, @selector(primaryText), (IMP)hook_status_primaryText, (IMP *)&orig_status_primaryText);
                          HookMethod(statusCls, @selector(displayText), (IMP)hook_status_displayText, (IMP *)&orig_status_displayText);
                      }

                      Class vmCls = objc_getClass("T1TweetViewModel");
                      if (vmCls) {
                          HookMethod(vmCls, @selector(primaryText), (IMP)hook_vm_primaryText, (IMP *)&orig_vm_primaryText);
                          HookMethod(vmCls, @selector(displayText), (IMP)hook_vm_displayText, (IMP *)&orig_vm_displayText);
                      }

                      SetupFloatingButton();
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
