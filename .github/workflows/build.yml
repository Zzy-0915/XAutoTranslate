name: Build JailFools Dylib (Crash-Free Engine)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          // ==================== 全局状态与日志管理器 ====================
          static NSMutableArray<NSString *> *gLogList = nil;
          static NSLock *gLogLock = nil;
          static NSMutableSet<NSString *> *gHookedKeys = nil;
          static NSMutableSet<NSString *> *gTriggeredIDs = nil;
          static __weak id gCurrentAccount = nil;
          static __weak UIViewController *gCurrentTimelineVC = nil;
          static BOOL gAppReady = NO;

          static NSString *const kPrefAutoTranslateEnabled = @"XAutoTranslate_Enabled";

          static void XLog(NSString *format, ...) {
              va_list args;
              va_start(args, format);
              NSString *msg = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);

              NSDateFormatter *df = [[NSDateFormatter alloc] init];
              [df setDateFormat:@"HH:mm:ss.SSS"];
              NSString *timestamp = [df stringFromDate:[NSDate date]];
              NSString *logEntry = [NSString stringWithFormat:@"[%@] %@", timestamp, msg];

              NSLog(@"[XAutoTranslate] %@", logEntry);

              [gLogLock lock];
              if (!gLogList) gLogList = [NSMutableArray array];
              [gLogList addObject:logEntry];
              if (gLogList.count > 800) [gLogList removeObjectAtIndex:0];
              [gLogLock unlock];
          }

          static BOOL IsAutoTranslateEnabled(void) {
              id val = [[NSUserDefaults standardUserDefaults] objectForKey:kPrefAutoTranslateEnabled];
              return val ? [val boolValue] : YES;
          }

          // ==================== 语种识别 ====================
          static BOOL IsAlreadyChineseText(NSString *text) {
              if (!text || text.length == 0) return YES;
              NSUInteger hanziCount = 0;
              NSUInteger alphaCount = 0;

              for (NSUInteger i = 0; i < text.length; i++) {
                  unichar c = [text characterAtIndex:i];
                  // 日文假名、韩文、泰文、阿拉伯文、俄文 -> 均需翻译
                  if ((c >= 0x3040 && c <= 0x30FF) || (c >= 0xFF66 && c <= 0xFF9F) ||
                      (c >= 0xAC00 && c <= 0xD7AF) || (c >= 0x0E00 && c <= 0x0E7F) ||
                      (c >= 0x0600 && c <= 0x06FF) || (c >= 0x0400 && c <= 0x04FF)) {
                      return NO;
                  }
                  if (c >= 0x4E00 && c <= 0x9FFF) {
                      hanziCount++;
                  } else if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
                      alphaCount++;
                  }
              }
              if (hanziCount == 0) return NO;
              if (hanziCount >= 2 && hanziCount * 3 >= alphaCount) return YES;
              return NO;
          }

          static id SafeCallObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2 || sig.methodReturnType[0] != '@') return nil;
              return ((id(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static BOOL SafeCallBool(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return NO;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2) return NO;
              char ret = sig.methodReturnType[0];
              if (ret != 'B' && ret != 'c') return NO;
              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static NSString *ExtractTweetID(id vmOrStatus) {
              if (!vmOrStatus) return nil;
              NSArray *idSelectors = @[@"statusIDString", @"statusID", @"tweetIDString", @"entryID"];
              for (NSString *selName in idSelectors) {
                  SEL sel = NSSelectorFromString(selName);
                  if ([vmOrStatus respondsToSelector:sel]) {
                      NSMethodSignature *sig = [vmOrStatus methodSignatureForSelector:sel];
                      if (sig && sig.numberOfArguments == 2) {
                          if (sig.methodReturnType[0] == '@') {
                              id val = ((id(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if ([val isKindOfClass:[NSString class]] && [(NSString *)val length] > 0) return val;
                          } else if (sig.methodReturnType[0] == 'q' || sig.methodReturnType[0] == 'Q') {
                              long long val = ((long long(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if (val > 0) return [NSString stringWithFormat:@"%lld", val];
                          }
                      }
                  }
              }
              id innerStatus = SafeCallObject(vmOrStatus, NSSelectorFromString(@"representedStatus")) ?:
                               SafeCallObject(vmOrStatus, NSSelectorFromString(@"status"));
              if (innerStatus && innerStatus != vmOrStatus) {
                  return ExtractTweetID(innerStatus);
              }
              return [NSString stringWithFormat:@"%p", vmOrStatus];
          }

          static BOOL ShouldTranslateViewModel(id vmOrStatus) {
              if (!IsAutoTranslateEnabled() || !vmOrStatus) return NO;

              NSString *lang = SafeCallObject(vmOrStatus, NSSelectorFromString(@"language")) ?:
                               SafeCallObject(vmOrStatus, NSSelectorFromString(@"primaryLanguage"));
              if ([lang isKindOfClass:[NSString class]] && ([lang hasPrefix:@"zh"] || [lang isEqualToString:@"und"])) {
                  return NO;
              }

              NSString *text = SafeCallObject(vmOrStatus, NSSelectorFromString(@"displayText")) ?:
                               SafeCallObject(vmOrStatus, NSSelectorFromString(@"text")) ?:
                               SafeCallObject(vmOrStatus, NSSelectorFromString(@"fullText"));
              if (!text) {
                  id s = SafeCallObject(vmOrStatus, NSSelectorFromString(@"status"));
                  if (s) text = SafeCallObject(s, NSSelectorFromString(@"displayText"));
              }
              if ([text isKindOfClass:[NSString class]]) {
                  if (text.length < 2 || IsAlreadyChineseText(text)) return NO;
              }
              return YES;
          }

          // 递归查找当前视图所属的控制器
          static UIViewController *FindViewControllerForView(UIView *view) {
              UIResponder *resp = view.nextResponder;
              while (resp) {
                  if ([resp isKindOfClass:[UIViewController class]]) {
                      return (UIViewController *)resp;
                  }
                  resp = resp.nextResponder;
              }
              return gCurrentTimelineVC;
          }

          // ==================== 核心：纯内存安全直连原生翻译引擎 ====================
          static void DispatchNativeTranslation(id viewModel, UIView *view) {
              if (!gAppReady || !IsAutoTranslateEnabled() || !viewModel) return;
              if (!ShouldTranslateViewModel(viewModel)) return;

              NSString *tid = ExtractTweetID(viewModel);
              if (tid) {
                  @synchronized (gTriggeredIDs) {
                      if ([gTriggeredIDs containsObject:tid]) return;
                      [gTriggeredIDs addObject:tid];
                  }
              }

              // 延迟 0.1 秒执行，等待视图完全装配到窗口
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.1 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  // 1. 如果按钮挂载了 tapActionBlock，优先执行（已被验证为零崩溃安全闭包）
                  UIView *btn = SafeCallObject(view, NSSelectorFromString(@"translateButton"));
                  if (!btn && [NSStringFromClass([view class]) isEqualToString:@"T1TranslateButton"]) {
                      btn = view;
                  }
                  if (btn && [btn respondsToSelector:NSSelectorFromString(@"tapActionBlock")]) {
                      void (^block)(void) = ((id(*)(id, SEL))objc_msgSend)(btn, NSSelectorFromString(@"tapActionBlock"));
                      if (block) {
                          XLog(@"[原生触发] 执行 tapActionBlock (ID: %@)", tid);
                          block();
                          return;
                      }
                  }

                  // 2. 直连官方核心 T1TranslationToggleEventHandler
                  UIViewController *controller = FindViewControllerForView(view) ?: gCurrentTimelineVC;
                  id account = nil;
                  if (controller && [controller respondsToSelector:NSSelectorFromString(@"account")]) {
                      account = SafeCallObject(controller, NSSelectorFromString(@"account"));
                  }
                  if (!account && gCurrentAccount) account = gCurrentAccount;
                  if (!account && [viewModel respondsToSelector:NSSelectorFromString(@"account")]) {
                      account = SafeCallObject(viewModel, NSSelectorFromString(@"account"));
                  }

                  Class toggleCls = objc_getClass("T1TranslationToggleEventHandler");
                  SEL toggleSel = NSSelectorFromString(@"_t1_toggleTranslationForViewModel:account:controller:");
                  if (toggleCls && [toggleCls instancesRespondToSelector:toggleSel] && viewModel && account) {
                      id handler = [[toggleCls alloc] init];
                      XLog(@"[原生触发] 直连调用 _t1_toggleTranslationForViewModel (ID: %@, VC: %@)", tid, NSStringFromClass([controller class]));
                      ((void(*)(id, SEL, id, id, id))objc_msgSend)(handler, toggleSel, viewModel, account, controller);
                  }
              });
          }

          // ==================== Hook 拦截点 ====================
          static BOOL CanHook(Class cls, SEL sel) {
              if (!cls || !sel) return NO;
              NSString *key = [NSString stringWithFormat:@"%@::%@", NSStringFromClass(cls), NSStringFromSelector(sel)];
              @synchronized (gHookedKeys) {
                  if ([gHookedKeys containsObject:key]) return NO;
                  [gHookedKeys addObject:key];
                  return YES;
              }
          }

          static void InstallSafeHooks(void) {
              // 1. 挂钩时间线控制器（静默捕获当前控制器和账号，绝不干涉 UI）
              Class urtCls = objc_getClass("T1URTViewController");
              if (urtCls) {
                  SEL didAppearSel = @selector(viewDidAppear:);
                  if (CanHook(urtCls, didAppearSel)) {
                      Method m = class_getInstanceMethod(urtCls, didAppearSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(UIViewController *self, BOOL animated) {
                              gCurrentTimelineVC = self;
                              id acc = SafeCallObject(self, NSSelectorFromString(@"account"));
                              if (acc) gCurrentAccount = acc;
                              ((void(*)(id, SEL, BOOL))orig)(self, didAppearSel, animated);
                          }));
                          XLog(@"[Hook成功] T1URTViewController -> viewDidAppear:");
                      }
                  }
              }

              // 2. 保持解锁时间线上的“显示翻译”按钮渲染（让时间线推文挂载翻译组件）
              Class grokHelperCls = objc_getClass("T1GrokPostTranslationDisplayHelper");
              if (grokHelperCls) {
                  SEL mBtnSel = NSSelectorFromString(@"shouldDisplayManualTranslateButton");
                  if (CanHook(grokHelperCls, mBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, mBtnSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
                  SEL aBtnSel = NSSelectorFromString(@"shouldDisplayAutoTranslateButton");
                  if (CanHook(grokHelperCls, aBtnSel)) {
                      Method m = class_getInstanceMethod(grokHelperCls, aBtnSel);
                      if (m) {
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self) {
                              return IsAutoTranslateEnabled() ? YES : NO;
                          }));
                      }
                  }
              }

              // 3. 挂钩标准翻译适配器（在数据绑定时后台安全触发翻译）
              Class translateAdapterCls = objc_getClass("T1StandardStatusTranslateAdapter");
              if (translateAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(translateAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                              if (IsAutoTranslateEnabled() && ShouldTranslateViewModel(viewModel)) {
                                  return YES;
                              }
                              return ((BOOL(*)(id, SEL, id))orig)(self, visSel, viewModel);
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(translateAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(translateAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id viewModel, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, viewModel, view);
                              DispatchNativeTranslation(viewModel, view);
                          }));
                          XLog(@"[Hook成功] T1StandardStatusTranslateAdapter -> setViewModel:forView:");
                      }
                  }
              }

              // 4. 挂钩 Grok 翻译适配器（新版 X 时间线核心翻译适配器）
              Class grokBtnAdapterCls = objc_getClass("T1StandardStatusGrokTranslateButtonViewAdapter");
              if (grokBtnAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  if (CanHook(grokBtnAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                              if (IsAutoTranslateEnabled() && ShouldTranslateViewModel(viewModel)) {
                                  return YES;
                              }
                              return ((BOOL(*)(id, SEL, id))orig)(self, visSel, viewModel);
                          }));
                      }
                  }

                  SEL setVMSel = NSSelectorFromString(@"setViewModel:forView:");
                  if (CanHook(grokBtnAdapterCls, setVMSel)) {
                      Method m = class_getInstanceMethod(grokBtnAdapterCls, setVMSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, id viewModel, UIView *view) {
                              ((void(*)(id, SEL, id, UIView *))orig)(self, setVMSel, viewModel, view);
                              DispatchNativeTranslation(viewModel, view);
                          }));
                          XLog(@"[Hook成功] T1StandardStatusGrokTranslateButtonViewAdapter -> setViewModel:forView:");
                      }
                  }
              }

              // 5. 挂钩 T1ConversationTranslatedBodyAdapter（译文生成后在时间线外部自动展开）
              Class bodyAdapterCls = objc_getClass("T1ConversationTranslatedBodyAdapter");
              if (bodyAdapterCls) {
                  SEL visSel = NSSelectorFromString(@"shouldBeVisibleForViewModel:");
                  SEL transVMSel = NSSelectorFromString(@"translatedViewModelForViewModel:");
                  if (CanHook(bodyAdapterCls, visSel)) {
                      Method m = class_getInstanceMethod(bodyAdapterCls, visSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                              BOOL origVal = ((BOOL(*)(id, SEL, id))orig)(self, visSel, viewModel);
                              if (origVal) return YES;
                              if (IsAutoTranslateEnabled() && [self respondsToSelector:transVMSel]) {
                                  id transVM = ((id(*)(id, SEL, id))objc_msgSend)(self, transVMSel, viewModel);
                                  if (transVM != nil) return YES;
                              }
                              return NO;
                          }));
                      }
                  }
              }

              // 6. 挂钩 T1PostTranslationInfo 状态变化（监控翻译结果）
              Class infoCls = objc_getClass("T1PostTranslationInfo");
              if (infoCls) {
                  SEL stateSel = NSSelectorFromString(@"setState:");
                  if (CanHook(infoCls, stateSel)) {
                      Method m = class_getInstanceMethod(infoCls, stateSel);
                      if (m) {
                          IMP orig = method_getImplementation(m);
                          method_setImplementation(m, imp_implementationWithBlock(^void(id self, long long state) {
                              XLog(@"[原生翻译状态变化] T1PostTranslationInfo -> state = %lld", state);
                              ((void(*)(id, SEL, long long))orig)(self, stateSel, state);
                              if (state == 3) {
                                  dispatch_async(dispatch_get_main_queue(), ^{
                                      id origStatus = SafeCallObject(self, NSSelectorFromString(@"originalStatus"));
                                      if (origStatus) {
                                          [[NSNotificationCenter defaultCenter] postNotificationName:@"TFNTwitterStatusDidUpdateNotification"
                                                                                              object:origStatus];
                                      }
                                  });
                              }
                          }));
                          XLog(@"[Hook成功] T1PostTranslationInfo -> setState:");
                      }
                  }
              }
          }

          // ==================== 悬浮球 & 菜单 ====================
          static void ShowSettingsMenu(void);

          @interface XFloatBtn : UIButton
          @property (nonatomic, assign) CGPoint startPoint;
          @end

          @implementation XFloatBtn
          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesBegan:touches withEvent:event];
              UITouch *t = [touches anyObject];
              self.startPoint = [t locationInView:self];
          }
          - (void)touchesMoved:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesMoved:touches withEvent:event];
              UITouch *t = [touches anyObject];
              CGPoint cur = [t locationInView:self.superview];
              self.center = CGPointMake(cur.x, cur.y);
          }
          - (void)onButtonClicked {
              ShowSettingsMenu();
          }
          @end

          static void ShowLogViewer(UIViewController *rootVC) {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];

              UIAlertController *logAlert = [UIAlertController alertControllerWithTitle:@"运行日志"
                                                                                message:fullLog.length > 0 ? fullLog : @"(暂无日志)"
                                                                         preferredStyle:UIAlertControllerStyleAlert];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"一键复制" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  [UIPasteboard generalPasteboard].string = fullLog;
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"导出为 TXT 文件" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *tmpPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"XAutoTranslate_Engine.log"];
                  [fullLog writeToFile:tmpPath atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  NSURL *fileURL = [NSURL fileURLWithPath:tmpPath];
                  UIActivityViewController *actVC = [[UIActivityViewController alloc] initWithActivityItems:@[fileURL] applicationActivities:nil];
                  [rootVC presentViewController:actVC animated:YES completion:nil];
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"关闭" style:UIAlertActionStyleCancel handler:nil]];
              [rootVC presentViewController:logAlert animated:YES completion:nil];
          }

          static void ShowSettingsMenu(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  UIViewController *topVC = window.rootViewController;
                  while (topVC.presentedViewController) topVC = topVC.presentedViewController;
                  if (!topVC) return;

                  BOOL isEnabled = IsAutoTranslateEnabled();

                  NSString *title = [NSString stringWithFormat:@"原生全自动翻译 (当前: %@)", isEnabled ? @"✅ 开启" : @"❌ 关闭"];
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:title
                                                                                 message:@"时间线外语推文后台直连自动翻译"
                                                                          preferredStyle:UIAlertControllerStyleActionSheet];

                  [alert addAction:[UIAlertAction actionWithTitle:(isEnabled ? @"暂停自动翻译" : @"开启自动翻译")
                                                             style:UIAlertActionStyleDefault
                                                           handler:^(UIAlertAction *action) {
                      [[NSUserDefaults standardUserDefaults] setBool:!isEnabled forKey:kPrefAutoTranslateEnabled];
                      [[NSUserDefaults standardUserDefaults] synchronize];
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"重置触发记录 (重新翻译当前屏幕)" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      @synchronized (gTriggeredIDs) {
                          [gTriggeredIDs removeAllObjects];
                      }
                      XLog(@"[提示] 已重置所有推文触发记录");
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"查看与导出运行日志" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      ShowLogViewer(topVC);
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
                  [topVC presentViewController:alert animated:YES completion:nil];
              });
          }

          static void SetupFloatingButton(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  if (!window) return;

                  XFloatBtn *btn = [XFloatBtn buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(window.bounds.size.width - 55, window.bounds.size.height - 220, 44, 44);
                  [btn setTitle:@"🌐" forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont systemFontOfSize:22];
                  btn.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.65];
                  btn.layer.cornerRadius = 22;
                  btn.layer.masksToBounds = YES;
                  btn.layer.borderColor = [[UIColor whiteColor] colorWithAlphaComponent:0.3].CGColor;
                  btn.layer.borderWidth = 1.5;

                  [btn addTarget:btn action:@selector(onButtonClicked) forControlEvents:UIControlEventTouchUpInside];
                  [window addSubview:btn];
                  XLog(@"[UI] 悬浮控制球挂载完毕");
              });
          }

          // ==================== 构造入口与冷启动保护 ====================
          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gLogList = [[NSMutableArray alloc] init];
                  gLogLock = [[NSLock alloc] init];
                  gHookedKeys = [[NSMutableSet alloc] init];
                  gTriggeredIDs = [[NSMutableSet alloc] init];

                  XLog(@"=== XAutoTranslate (防闪退原生引擎版) 启动 ===");

                  dispatch_async(dispatch_get_main_queue(), ^{
                      InstallSafeHooks();
                      SetupFloatingButton();
                  });

                  // 核心冷启动保护：等待 App 完全进入主页 1.5 秒后再开放触发，绝不引起启动闪退
                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      gAppReady = YES;
                      XLog(@"[安全门禁] 主时间线就绪，全自动翻译引擎已激活");
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
