name: Build JailFools Dylib (Native Timeline Auto-Trigger)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Code & Compile Dylib
        run: |
          mkdir -p output

          cat << 'EOF' > Tweak.m
          #import <Foundation/Foundation.h>
          #import <UIKit/UIKit.h>
          #import <objc/runtime.h>
          #import <objc/message.h>

          static NSMutableArray<NSString *> *gLogList = nil;
          static NSLock *gLogLock = nil;
          static NSMutableSet<NSString *> *gHookedKeys = nil;
          static NSMutableSet<NSString *> *gTriggeredTweetIDs = nil;

          static NSString *const kPrefAutoTranslateEnabled = @"XAutoTranslate_Enabled";
          static const char *kGestureTargetsKey = "kXGestureTargetsKey";
          static const char *kViewTriggeredKey = "kXViewTriggeredKey";

          static void XLog(NSString *format, ...) {
              va_list args;
              va_start(args, format);
              NSString *msg = [[NSString alloc] initWithFormat:format arguments:args];
              va_end(args);

              NSDateFormatter *df = [[NSDateFormatter alloc] init];
              [df setDateFormat:@"HH:mm:ss.SSS"];
              NSString *timestamp = [df stringFromDate:[NSDate date]];
              NSString *logEntry = [NSString stringWithFormat:@"[%@] %@", timestamp, msg];

              NSLog(@"[XAutoTranslate] %@", logEntry);

              [gLogLock lock];
              if (!gLogList) gLogList = [NSMutableArray array];
              [gLogList addObject:logEntry];
              if (gLogList.count > 800) [gLogList removeObjectAtIndex:0];
              [gLogLock unlock];
          }

          static BOOL IsAutoTranslateEnabled(void) {
              id val = [[NSUserDefaults standardUserDefaults] objectForKey:kPrefAutoTranslateEnabled];
              return val ? [val boolValue] : YES;
          }

          static BOOL IsAlreadyChineseText(NSString *text) {
              if (!text || text.length == 0) return YES;
              NSUInteger hanziCount = 0;
              NSUInteger alphaCount = 0;

              for (NSUInteger i = 0; i < text.length; i++) {
                  unichar c = [text characterAtIndex:i];
                  if ((c >= 0x3040 && c <= 0x30FF) || (c >= 0xFF66 && c <= 0xFF9F) ||
                      (c >= 0xAC00 && c <= 0xD7AF) || (c >= 0x0E00 && c <= 0x0E7F) ||
                      (c >= 0x0600 && c <= 0x06FF) || (c >= 0x0400 && c <= 0x04FF)) {
                      return NO;
                  }
                  if (c >= 0x4E00 && c <= 0x9FFF) {
                      hanziCount++;
                  } else if ((c >= 'a' && c <= 'z') || (c >= 'A' && c <= 'Z')) {
                      alphaCount++;
                  }
              }
              if (hanziCount == 0) return NO;
              if (hanziCount >= 2 && hanziCount * 3 >= alphaCount) return YES;
              return NO;
          }

          static id SafeCallZeroArgObject(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return nil;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2 || sig.methodReturnType[0] != '@') return nil;
              return ((id(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static BOOL SafeCallZeroArgBool(id obj, SEL sel) {
              if (!obj || ![obj respondsToSelector:sel]) return NO;
              NSMethodSignature *sig = [obj methodSignatureForSelector:sel];
              if (!sig || sig.numberOfArguments != 2) return NO;
              char ret = sig.methodReturnType[0];
              if (ret != 'B' && ret != 'c') return NO;
              return ((BOOL(*)(id, SEL))objc_msgSend)(obj, sel);
          }

          static NSString *ExtractTweetID(id vmOrStatus) {
              if (!vmOrStatus) return nil;
              NSArray *idSelectors = @[@"statusIDString", @"statusID", @"tweetIDString"];
              for (NSString *selName in idSelectors) {
                  SEL sel = NSSelectorFromString(selName);
                  if ([vmOrStatus respondsToSelector:sel]) {
                      NSMethodSignature *sig = [vmOrStatus methodSignatureForSelector:sel];
                      if (sig && sig.numberOfArguments == 2) {
                          if (sig.methodReturnType[0] == '@') {
                              id val = ((id(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if ([val isKindOfClass:[NSString class]] && [(NSString *)val length] > 0) return val;
                          } else if (sig.methodReturnType[0] == 'q' || sig.methodReturnType[0] == 'Q') {
                              long long val = ((long long(*)(id, SEL))objc_msgSend)(vmOrStatus, sel);
                              if (val > 0) return [NSString stringWithFormat:@"%lld", val];
                          }
                      }
                  }
              }
              id innerStatus = SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"status"));
              if (innerStatus && innerStatus != vmOrStatus) {
                  return ExtractTweetID(innerStatus);
              }
              return [NSString stringWithFormat:@"%p", vmOrStatus];
          }

          static BOOL ShouldTranslateViewModel(id vmOrStatus) {
              if (!IsAutoTranslateEnabled() || !vmOrStatus) return NO;

              if (SafeCallZeroArgBool(vmOrStatus, NSSelectorFromString(@"isShowingTranslation")) ||
                  SafeCallZeroArgBool(vmOrStatus, NSSelectorFromString(@"isTranslated"))) {
                  return NO;
              }

              NSString *lang = SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"primaryLanguage")) ?:
                               SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"language"));
              if ([lang isKindOfClass:[NSString class]] && ([lang hasPrefix:@"zh"] || [lang isEqualToString:@"und"])) {
                  return NO;
              }

              NSString *text = SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"displayText")) ?:
                               SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"primaryText")) ?:
                               SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"text"));
              if (!text) {
                  id subStatus = SafeCallZeroArgObject(vmOrStatus, NSSelectorFromString(@"status"));
                  if (subStatus) {
                      text = SafeCallZeroArgObject(subStatus, NSSelectorFromString(@"displayText"));
                  }
              }
              if ([text isKindOfClass:[NSString class]]) {
                  if (text.length < 3 || IsAlreadyChineseText(text)) return NO;
              }
              return YES;
          }

          static BOOL FireNativeTriggerInView(UIView *view) {
              if (!view) return NO;
              BOOL triggered = NO;

              if ([view isKindOfClass:[UIControl class]]) {
                  UIControl *ctrl = (UIControl *)view;
                  if (ctrl.allTargets.count > 0) {
                      [ctrl sendActionsForControlEvents:UIControlEventTouchUpInside];
                      XLog(@"[原生触发] 已触发 UIControl 点击: %@", NSStringFromClass([view class]));
                      triggered = YES;
                  }
              }

              NSString *clsName = NSStringFromClass([view class]);
              if ([clsName containsString:@"AttributedTextView"]) {
                  id delegate = SafeCallZeroArgObject(view, NSSelectorFromString(@"delegate"));
                  NSArray *ranges = SafeCallZeroArgObject(view, NSSelectorFromString(@"activeRanges"));
                  SEL tapSel = NSSelectorFromString(@"attributedTextView:didTapRange:withAttributes:");
                  if (delegate && [delegate respondsToSelector:tapSel] && [ranges isKindOfClass:[NSArray class]] && ranges.count > 0) {
                      ((void(*)(id, SEL, id, id, id))objc_msgSend)(delegate, tapSel, view, ranges.firstObject, @{});
                      XLog(@"[原生触发] 已触发富文本翻译链接代理: %@", NSStringFromClass([delegate class]));
                      triggered = YES;
                  }
              }

              for (UIGestureRecognizer *gr in view.gestureRecognizers) {
                  if ([gr isKindOfClass:[UITapGestureRecognizer class]] || [NSStringFromClass([gr class]) containsString:@"Tap"]) {
                      NSArray *pairs = objc_getAssociatedObject(gr, kGestureTargetsKey);
                      for (NSDictionary *pair in pairs) {
                          NSValue *targetVal = pair[@"target"];
                          NSString *actionStr = pair[@"action"];
                          id target = [targetVal nonretainedObjectValue];
                          SEL action = NSSelectorFromString(actionStr);
                          if (target && action && [target respondsToSelector:action]) {
                              ((void(*)(id, SEL, id))objc_msgSend)(target, action, gr);
                              XLog(@"[原生触发] 已执行手势回调: [%@ %@]", NSStringFromClass([target class]), actionStr);
                              triggered = YES;
                          }
                      }
                  }
              }

              for (UIView *sub in view.subviews) {
                  if (FireNativeTriggerInView(sub)) {
                      triggered = YES;
                  }
              }
              return triggered;
          }

          static void AutoInvokeNativeTranslation(id adapter, UIView *view, id viewModel) {
              if (!IsAutoTranslateEnabled()) return;
              if (viewModel && !ShouldTranslateViewModel(viewModel)) return;

              NSString *tid = ExtractTweetID(viewModel ?: view);
              if (tid) {
                  @synchronized (gTriggeredTweetIDs) {
                      if ([gTriggeredTweetIDs containsObject:tid]) return;
                      [gTriggeredTweetIDs addObject:tid];
                  }
              }

              dispatch_async(dispatch_get_main_queue(), ^{
                  BOOL didFire = NO;

                  if (adapter) {
                      unsigned int count = 0;
                      Method *methods = class_copyMethodList([adapter class], &count);
                      for (unsigned int i = 0; i < count; i++) {
                          SEL sel = method_getName(methods[i]);
                          NSString *selName = NSStringFromSelector(sel);
                          if (([selName containsString:@"Tap"] || [selName containsString:@"tap"] ||
                               [selName hasPrefix:@"translate"] || [selName hasPrefix:@"_t1_translate"]) &&
                              ![selName containsString:@"should"] && ![selName containsString:@"is"]) {
                              NSMethodSignature *sig = [adapter methodSignatureForSelector:sel];
                              if (sig && sig.methodReturnType[0] == 'v') {
                                  if (sig.numberOfArguments == 2) {
                                      ((void(*)(id, SEL))objc_msgSend)(adapter, sel);
                                      XLog(@"[原生触发] 调用 Adapter 无参方法: [%@ %@]", NSStringFromClass([adapter class]), selName);
                                      didFire = YES;
                                      break;
                                  } else if (sig.numberOfArguments == 3 && [sig getArgumentTypeAtIndex:2][0] == '@') {
                                      id arg = view ?: viewModel;
                                      ((void(*)(id, SEL, id))objc_msgSend)(adapter, sel, arg);
                                      XLog(@"[原生触发] 调用 Adapter 单参方法: [%@ %@]", NSStringFromClass([adapter class]), selName);
                                      didFire = YES;
                                      break;
                                  }
                              }
                          }
                      }
                      if (methods) free(methods);
                  }

                  if (!didFire && view) {
                      didFire = FireNativeTriggerInView(view);
                  }

                  if (viewModel) {
                      NSArray *vmTriggers = @[@"translate", @"translateStatus", @"fetchTranslation", @"loadTranslation", @"toggleTranslation", @"requestTranslation"];
                      for (NSString *tName in vmTriggers) {
                          SEL sel = NSSelectorFromString(tName);
                          if ([viewModel respondsToSelector:sel]) {
                              NSMethodSignature *sig = [viewModel methodSignatureForSelector:sel];
                              if (sig && sig.numberOfArguments == 2 && sig.methodReturnType[0] == 'v') {
                                  ((void(*)(id, SEL))objc_msgSend)(viewModel, sel);
                                  XLog(@"[原生触发] 调用 ViewModel 方法: [%@ %@]", NSStringFromClass([viewModel class]), tName);
                                  didFire = YES;
                              }
                          }
                      }
                  }
              });
          }

          static BOOL CanHookClassSelector(Class cls, SEL sel) {
              if (!cls || !sel) return NO;
              NSString *key = [NSString stringWithFormat:@"%@::%@", NSStringFromClass(cls), NSStringFromSelector(sel)];
              @synchronized (gHookedKeys) {
                  if ([gHookedKeys containsObject:key]) return NO;
                  [gHookedKeys addObject:key];
                  return YES;
              }
          }

          static void HookGestureRecognizers(void) {
              Class grCls = [UIGestureRecognizer class];
              SEL initSel = @selector(initWithTarget:action:);
              if (CanHookClassSelector(grCls, initSel)) {
                  Method m = class_getInstanceMethod(grCls, initSel);
                  if (m) {
                      IMP origIMP = method_getImplementation(m);
                      IMP newIMP = imp_implementationWithBlock(^id(id self, id target, SEL action) {
                          id instance = ((id(*)(id, SEL, id, SEL))origIMP)(self, initSel, target, action);
                          if (instance && target && action) {
                              NSMutableArray *arr = objc_getAssociatedObject(instance, kGestureTargetsKey) ?: [NSMutableArray array];
                              [arr addObject:@{@"target": [NSValue valueWithNonretainedObject:target], @"action": NSStringFromSelector(action)}];
                              objc_setAssociatedObject(instance, kGestureTargetsKey, arr, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                          }
                          return instance;
                      });
                      method_setImplementation(m, newIMP);
                  }
              }

              SEL addSel = @selector(addTarget:action:);
              if (CanHookClassSelector(grCls, addSel)) {
                  Method m = class_getInstanceMethod(grCls, addSel);
                  if (m) {
                      IMP origIMP = method_getImplementation(m);
                      IMP newIMP = imp_implementationWithBlock(^void(id self, id target, SEL action) {
                          ((void(*)(id, SEL, id, SEL))origIMP)(self, addSel, target, action);
                          if (target && action) {
                              NSMutableArray *arr = objc_getAssociatedObject(self, kGestureTargetsKey) ?: [NSMutableArray array];
                              [arr addObject:@{@"target": [NSValue valueWithNonretainedObject:target], @"action": NSStringFromSelector(action)}];
                              objc_setAssociatedObject(self, kGestureTargetsKey, arr, OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                          }
                      });
                      method_setImplementation(m, newIMP);
                  }
              }
          }

          static void ScanAndHookNativeTranslation(void) {
              int numClasses = objc_getClassList(NULL, 0);
              if (numClasses <= 0) return;
              Class *classes = (Class *)malloc(sizeof(Class) * numClasses);
              numClasses = objc_getClassList(classes, numClasses);

              for (int i = 0; i < numClasses; i++) {
                  Class cls = classes[i];
                  const char *rawName = class_getName(cls);
                  if (!rawName) continue;

                  if (strncmp(rawName, "T1", 2) != 0 &&
                      strncmp(rawName, "TFN", 3) != 0 &&
                      strncmp(rawName, "TFS", 3) != 0 &&
                      strncmp(rawName, "_TtC", 4) != 0) {
                      continue;
                  }

                  NSString *clsName = [NSString stringWithUTF8String:rawName];
                  BOOL isTranslateClass = ([clsName rangeOfString:@"Translat" options:NSCaseInsensitiveSearch].location != NSNotFound);
                  BOOL isStatusOrVMClass = ([clsName isEqualToString:@"TFNTwitterStatus"] ||
                                            [clsName containsString:@"StatusViewModel"] ||
                                            [clsName containsString:@"TweetViewModel"]);

                  if (!isTranslateClass && !isStatusOrVMClass) continue;

                  unsigned int methodCount = 0;
                  Method *methods = class_copyMethodList(cls, &methodCount);

                  for (unsigned int j = 0; j < methodCount; j++) {
                      Method m = methods[j];
                      SEL sel = method_getName(m);
                      NSString *selName = NSStringFromSelector(sel);
                      const char *typeEnc = method_getTypeEncoding(m);
                      if (!typeEnc) continue;

                      BOOL isTranslateSel = ([selName rangeOfString:@"translat" options:NSCaseInsensitiveSearch].location != NSNotFound);

                      if (isTranslateClass || isTranslateSel) {
                          XLog(@"[发现原生符号] %@ -> %@ (%s)", clsName, selName, typeEnc);
                      }

                      if (isTranslateClass && ([selName isEqualToString:@"shouldBeVisibleForViewModel:"] ||
                                               [selName isEqualToString:@"isVisibleForViewModel:"])) {
                          if (CanHookClassSelector(cls, sel)) {
                              IMP origIMP = method_getImplementation(m);
                              IMP newIMP = imp_implementationWithBlock(^BOOL(id self, id viewModel) {
                                  if (IsAutoTranslateEnabled() && ShouldTranslateViewModel(viewModel)) {
                                      return YES;
                                  }
                                  return ((BOOL(*)(id, SEL, id))origIMP)(self, sel, viewModel);
                              });
                              method_setImplementation(m, newIMP);
                              XLog(@"[Hook成功-解除时间线隐藏] [%@ %@]", clsName, selName);
                          }
                      }

                      if (isTranslateClass && [selName isEqualToString:@"viewModel:didUpdateWithInfo:forView:"]) {
                          if (CanHookClassSelector(cls, sel)) {
                              IMP origIMP = method_getImplementation(m);
                              IMP newIMP = imp_implementationWithBlock(^void(id self, id viewModel, id info, UIView *view) {
                                  ((void(*)(id, SEL, id, id, UIView *))origIMP)(self, sel, viewModel, info, view);
                                  AutoInvokeNativeTranslation(self, view, viewModel);
                              });
                              method_setImplementation(m, newIMP);
                              XLog(@"[Hook成功-滑动自动触发] [%@ %@]", clsName, selName);
                          }
                      }

                      if (isTranslateClass && [selName isEqualToString:@"setViewModel:forView:"]) {
                          if (CanHookClassSelector(cls, sel)) {
                              IMP origIMP = method_getImplementation(m);
                              IMP newIMP = imp_implementationWithBlock(^void(id self, id viewModel, UIView *view) {
                                  ((void(*)(id, SEL, id, UIView *))origIMP)(self, sel, viewModel, view);
                                  AutoInvokeNativeTranslation(self, view, viewModel);
                              });
                              method_setImplementation(m, newIMP);
                              XLog(@"[Hook成功-滑动自动触发] [%@ %@]", clsName, selName);
                          }
                      }

                      if (isTranslateClass && [cls isSubclassOfClass:[UIView class]] && [selName isEqualToString:@"layoutSubviews"]) {
                          if (CanHookClassSelector(cls, sel)) {
                              IMP origIMP = method_getImplementation(m);
                              IMP newIMP = imp_implementationWithBlock(^void(UIView *self) {
                                  ((void(*)(id, SEL))origIMP)(self, sel);
                                  if (IsAutoTranslateEnabled() && self.window) {
                                      NSNumber *done = objc_getAssociatedObject(self, kViewTriggeredKey);
                                      if (!done || ![done boolValue]) {
                                          objc_setAssociatedObject(self, kViewTriggeredKey, @(YES), OBJC_ASSOCIATION_RETAIN_NONATOMIC);
                                          dispatch_async(dispatch_get_main_queue(), ^{
                                              FireNativeTriggerInView(self);
                                          });
                                      }
                                  }
                              });
                              method_setImplementation(m, newIMP);
                              XLog(@"[Hook成功-翻译视图自动触发] [%@ layoutSubviews]", clsName);
                          }
                      }

                      if (isStatusOrVMClass && ([selName isEqualToString:@"isTranslatable"] ||
                                                [selName isEqualToString:@"isTranslationAvailable"] ||
                                                [selName isEqualToString:@"shouldShowTranslateButton"] ||
                                                [selName isEqualToString:@"isInlineTranslationAvailable"] ||
                                                [selName isEqualToString:@"canTranslate"])) {
                          if ((typeEnc[0] == 'B' || typeEnc[0] == 'c') && CanHookClassSelector(cls, sel)) {
                              IMP origIMP = method_getImplementation(m);
                              IMP newIMP = imp_implementationWithBlock(^BOOL(id self) {
                                  if (IsAutoTranslateEnabled() && ShouldTranslateViewModel(self)) {
                                      return YES;
                                  }
                                  return ((BOOL(*)(id, SEL))origIMP)(self, sel);
                              });
                              method_setImplementation(m, newIMP);
                              XLog(@"[Hook成功-开启原生翻译权限] [%@ %@]", clsName, selName);
                          }
                      }
                  }
                  if (methods) free(methods);
              }
              free(classes);
          }

          static void ShowSettingsMenu(void);

          @interface XFloatBtn : UIButton
          @property (nonatomic, assign) CGPoint startPoint;
          @end

          @implementation XFloatBtn
          - (void)touchesBegan:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesBegan:touches withEvent:event];
              UITouch *t = [touches anyObject];
              self.startPoint = [t locationInView:self];
          }
          - (void)touchesMoved:(NSSet<UITouch *> *)touches withEvent:(UIEvent *)event {
              [super touchesMoved:touches withEvent:event];
              UITouch *t = [touches anyObject];
              CGPoint cur = [t locationInView:self.superview];
              self.center = CGPointMake(cur.x, cur.y);
          }
          - (void)onButtonClicked {
              ShowSettingsMenu();
          }
          @end

          static void ShowLogViewer(UIViewController *rootVC) {
              [gLogLock lock];
              NSString *fullLog = [gLogList componentsJoinedByString:@"\n"];
              [gLogLock unlock];

              UIAlertController *logAlert = [UIAlertController alertControllerWithTitle:@"运行与符号日志"
                                                                                message:fullLog.length > 0 ? fullLog : @"(暂无日志)"
                                                                         preferredStyle:UIAlertControllerStyleAlert];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"一键复制" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  [UIPasteboard generalPasteboard].string = fullLog;
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"导出为 TXT 文件" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                  NSString *tmpPath = [NSTemporaryDirectory() stringByAppendingPathComponent:@"XAutoTranslate_Native.log"];
                  [fullLog writeToFile:tmpPath atomically:YES encoding:NSUTF8StringEncoding error:nil];
                  NSURL *fileURL = [NSURL fileURLWithPath:tmpPath];
                  UIActivityViewController *actVC = [[UIActivityViewController alloc] initWithActivityItems:@[fileURL] applicationActivities:nil];
                  [rootVC presentViewController:actVC animated:YES completion:nil];
              }]];

              [logAlert addAction:[UIAlertAction actionWithTitle:@"关闭" style:UIAlertActionStyleCancel handler:nil]];
              [rootVC presentViewController:logAlert animated:YES completion:nil];
          }

          static void ShowSettingsMenu(void) {
              dispatch_async(dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  UIViewController *topVC = window.rootViewController;
                  while (topVC.presentedViewController) topVC = topVC.presentedViewController;
                  if (!topVC) return;

                  BOOL isEnabled = IsAutoTranslateEnabled();

                  NSString *title = [NSString stringWithFormat:@"X 原生自动翻译 (当前: %@)", isEnabled ? @"✅ 开启" : @"❌ 关闭"];
                  UIAlertController *alert = [UIAlertController alertControllerWithTitle:title
                                                                                 message:[NSString stringWithFormat:@"已挂载原生 Hook 点: %lu 个", (unsigned long)gHookedKeys.count]
                                                                          preferredStyle:UIAlertControllerStyleActionSheet];

                  [alert addAction:[UIAlertAction actionWithTitle:(isEnabled ? @"暂停自动触发原生翻译" : @"开启自动触发原生翻译")
                                                             style:UIAlertActionStyleDefault
                                                           handler:^(UIAlertAction *action) {
                      [[NSUserDefaults standardUserDefaults] setBool:!isEnabled forKey:kPrefAutoTranslateEnabled];
                      [[NSUserDefaults standardUserDefaults] synchronize];
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"重新扫描并挂载原生翻译类" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      ScanAndHookNativeTranslation();
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"查看与导出运行日志" style:UIAlertActionStyleDefault handler:^(UIAlertAction *action) {
                      ShowLogViewer(topVC);
                  }]];

                  [alert addAction:[UIAlertAction actionWithTitle:@"取消" style:UIAlertActionStyleCancel handler:nil]];
                  [topVC presentViewController:alert animated:YES completion:nil];
              });
          }

          static void SetupFloatingButton(void) {
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.5 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                  UIWindow *window = nil;
                  for (UIWindow *w in [UIApplication sharedApplication].windows) {
                      if (w.isKeyWindow) { window = w; break; }
                  }
                  if (!window) window = [UIApplication sharedApplication].windows.firstObject;
                  if (!window) return;

                  XFloatBtn *btn = [XFloatBtn buttonWithType:UIButtonTypeCustom];
                  btn.frame = CGRectMake(window.bounds.size.width - 55, window.bounds.size.height - 220, 44, 44);
                  [btn setTitle:@"🌐" forState:UIControlStateNormal];
                  btn.titleLabel.font = [UIFont systemFontOfSize:22];
                  btn.backgroundColor = [[UIColor blackColor] colorWithAlphaComponent:0.65];
                  btn.layer.cornerRadius = 22;
                  btn.layer.masksToBounds = YES;
                  btn.layer.borderColor = [[UIColor whiteColor] colorWithAlphaComponent:0.3].CGColor;
                  btn.layer.borderWidth = 1.5;

                  [btn addTarget:btn action:@selector(onButtonClicked) forControlEvents:UIControlEventTouchUpInside];
                  [window addSubview:btn];
                  XLog(@"[UI] 悬浮控制球挂载完毕");
              });
          }

          __attribute__((constructor)) static void initTweak(void) {
              @autoreleasepool {
                  gLogList = [[NSMutableArray alloc] init];
                  gLogLock = [[NSLock alloc] init];
                  gHookedKeys = [[NSMutableSet alloc] init];
                  gTriggeredTweetIDs = [[NSMutableSet alloc] init];

                  XLog(@"=== XAutoTranslate (X 原生翻译自动触发版) 启动 ===");

                  HookGestureRecognizers();

                  dispatch_async(dispatch_get_main_queue(), ^{
                      ScanAndHookNativeTranslation();
                      SetupFloatingButton();
                  });

                  dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(2.0 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                      ScanAndHookNativeTranslation();
                  });
              }
          }
          EOF

          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib \
            -miphoneos-version-min=15.0 \
            -fobjc-arc \
            -framework Foundation -framework UIKit \
            -Wno-deprecated-declarations \
            -Wl,-no_fixup_chains \
            -o output/XAutoTranslate.dylib \
            Tweak.m

          codesign -s - --force output/XAutoTranslate.dylib
          ls -la output/

      - name: Upload Dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-JailFools
          path: output/XAutoTranslate.dylib
