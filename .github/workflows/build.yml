name: Build XAutoTranslate with Apple SDK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Compile and sign with iPhoneOS SDK
        run: bash scripts/build-ios.sh
      - name: Check build without temporary diagnostics
        env:
          XAD_DIAGNOSTICS: '0'
          XAD_OUTPUT_DIR: build/no-diagnostics
        run: bash scripts/build-ios.sh
      - name: Upload verified dylib
        uses: actions/upload-artifact@v4
        with:
          name: XAutoTranslate-v4-X12.33-${{ github.run_number }}
          path: |
            output/XAutoTranslate-v4.dylib
            output/build-info.txt
            output/README.md
          if-no-files-found: error
          retention-days: 30
